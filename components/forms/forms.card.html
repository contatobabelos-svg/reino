<body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Field, Switch, Toolbar, Button } = window.BabelOSDesignSystem_5ad360;
function Demo() {
  return (
    <div style={{ display: "grid", gap: ".9rem" }}>
      <Toolbar as="form" onSubmit={(e) => e.preventDefault()}>
        <Input placeholder="Adicionar: PETR4, HGLG11…" />
        <Button variant="cyan" type="submit">Adicionar</Button>
        <Select defaultValue="variacao">
          <option value="variacao">Maior variação</option>
          <option value="valor">Maior preço</option>
          <option value="volume">Maior volume</option>
        </Select>
        <Button variant="ghost" type="button">Lista padrão</Button>
      </Toolbar>
      <Toolbar>
        <Field inline label="Região"><Select><option>Sudeste</option><option>Sul</option></Select></Field>
        <Field inline label="Estado"><Select><option>São Paulo</option></Select></Field>
        <Field inline label="Nicho"><Select><option>Todos os nichos</option></Select></Field>
      </Toolbar>
      <div style={{ maxWidth: 380 }}>
        <Field label="Cidade" hint="Só cidades com empresas cadastradas." htmlFor="c"><Input id="c" defaultValue="Campinas" /></Field>
        <Switch id="d" label="Dados de demonstração" defaultChecked />
        <Switch id="n" label="Notificações de match" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
