  const [motivo, setMotivo] = React.useState("");
  const [campanha, setCampanha] = React.useState("instagram");
  const [links, setLinks] = React.useState(() => { try { return JSON.parse(localStorage.getItem("reino.links") || "[]"); } catch (e) { return []; } });
  const [aviso, setAviso] = React.useState("");
  const [senha, setSenha] = React.useState("");
  const campo = (k) => (e) => setF((v) => ({ ...v, [k]: e.target.value }));
  const dizer = (t) => { setAviso(t); setTimeout(() => setAviso(""), 2200); };
  React.useEffect(() => { try { localStorage.setItem("reino.links", JSON.stringify(links)); } catch (e) {} }, [links]);

  const situacao = (localStorage.getItem("reino.situacao") || s.situacao || "membro");
  const linkBase = A ? A.linkDe(codigo) : "";
  const linkCom = (c) => linkBase + (linkBase.includes("?") ? "&" : "?") + "c=" + encodeURIComponent(c);

  const verificar = async () => {
    const v = await C.codigoLivre(codigo);
    setChecando(v.ok ? "ok" : "erro"); setMotivo(v.ok ? "" : v.motivo);
    if (v.ok) setCodigo(v.codigo);
  };
  const salvarCodigo = async () => {
    const v = await C.reservarCodigo(codigo);
    if (!v.ok) { setChecando("erro"); setMotivo(v.motivo); return; }
    setCodigo(v.codigo); setChecando("ok"); dizer("Código salvo: " + v.codigo);
  };
  const salvarDados = async () => { await C.salvarPerfil({ ...f }); dizer("Dados salvos."); };
  const copiar = async (url) => { try { await navigator.clipboard.writeText(url); dizer("Link copiado."); } catch (e) {} };
  const criarLink = () => {
    const c = C.limpar(campanha);
    if (!c) return;
    if (links.some((l) => l.campanha === c)) { dizer("Você já tem um link dessa campanha."); return; }
    setLinks([{ campanha: c, url: linkCom(c), criado: new Date().toISOString() }, ...links]);
  };
  const trocarSenha = async () => {
    if (senha.length < 6) { dizer("A senha precisa de 6 caracteres."); return; }
    try { await C.trocarSenha(senha); setSenha(""); dizer("Senha trocada."); } catch (e) { dizer(e.message); }
  };
  const sair = () => { C.sair(); sessionStorage.setItem("reino.logado", ""); location.reload(); };

  return (
    <>
      <PageHead title="Minha conta" subtitle="Seus dados, sua foto e os links que trazem gente para o Reino.">
        <div className="hg-head-acoes">
          <Pill as="span">{situacao === "pre-cadastro" ? "Pré-cadastro" : "Membro do Reino"}</Pill>
          <Button variant="ghost" onClick={sair}>Sair</Button>
        </div>
      </PageHead>

      {!C.online() ? <p className="hg-af-aviso"><Icon name="alerta" />Login em modo demonstração: sem banco conectado, qualquer senha entra e os dados ficam neste navegador.</p> : null}
      {s.confirmar ? <p className="hg-af-aviso"><Icon name="alerta" />Confirme o e-mail que enviamos para <b>{s.email}</b> para validar seu login.</p> : null}

      <div className="hg-duas">
        <Panel title="Quem você é" subtitle="Aparece no mapa, no feed e para quem você indica" headingLevel={3}>
          <div className="hg-perfil-topo">
            <FotoAvatar chave={f.nome || nome} nome={f.nome || nome} size={84} editavel camera />
            <div>
              <strong>{f.nome || nome}</strong>
              <span>{f.titulo} · {f.cidade} · {f.uf}</span>
              <span className="hg-sub">{s.email || "sem e-mail cadastrado"}</span>
            </div>
          </div>
          <form className="hg-form" onSubmit={(e) => { e.preventDefault(); salvarDados(); }}>
            <Field label="Nome" htmlFor="p-nome"><Input id="p-nome" value={f.nome} onChange={campo("nome")} autoComplete="name" /></Field>
            <Field label="E-mail" htmlFor="p-email" hint={C.online() ? "É o que valida seu login." : undefined}><Input id="p-email" type="email" value={f.email} onChange={campo("email")} autoComplete="email" /></Field>
            <Field label="Título" htmlFor="p-titulo">
              <Select id="p-titulo" value={f.titulo} onChange={campo("titulo")}>
                {["Imperador", "Rei", "Príncipe", "Duque", "Marquês", "Conde", "Visconde", "Barão"].map((t) => <option key={t}>{t}</option>)}
              </Select>
            </Field>
            <Field label="Onde você atua" htmlFor="p-cidade">
              <div style={{ display: "grid", gridTemplateColumns: "2fr 80px", gap: ".5rem" }}>
                <Input id="p-cidade" value={f.cidade} onChange={campo("cidade")} placeholder="Cidade" />
                <Input value={f.uf} onChange={campo("uf")} placeholder="UF" maxLength={2} />
              </div>
            </Field>
            <Toolbar><Button variant="cyan" type="submit">Salvar dados</Button></Toolbar>
          </form>
        </Panel>

        <Panel tone="afiliado" title="Seu código de afiliado" subtitle="Escolha o nome que aparece no seu link" headingLevel={3}>
          <div className="hg-cod">
            <span className="hg-cod-fixo">{(window.REINO_DOMINIO || location.origin).replace(/^https?:\/\//, "")}/?ref=</span>
            <Input value={codigo} onChange={(e) => { setCodigo(e.target.value); setChecando(null); }} aria-label="Código" spellCheck={false} />
            <Button variant="ghost" onClick={verificar}>Verificar</Button>
          </div>
          {checando === "ok" ? <p className="hg-cod-ok"><Icon name="coroa" />Código livre. Pode salvar.</p> : null}
          {checando === "erro" ? <p className="hg-cod-erro"><Icon name="alerta" />{motivo}</p> : null}
          <Toolbar>
            <Button variant="green" onClick={salvarCodigo}>Salvar código</Button>
            <Button variant="ghost" onClick={() => copiar(linkBase)}>Copiar link</Button>
          </Toolbar>
          <p className="hg-sub">Só letras, números e hífen. Quem entrar por esse link fica ligado a você.</p>
          <hr className="hg-filete" />
          <h4 className="hg-title" style={{ fontSize: ".9rem" }}>Trocar senha</h4>
          <Toolbar>
            <Input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} placeholder="Nova senha" autoComplete="new-password" />
            <Button variant="ghost" onClick={trocarSenha} disabled={!C.online()}>Trocar</Button>
          </Toolbar>
        </Panel>
      </div>

      <Panel title="Links por campanha" subtitle="Um link para cada lugar onde você divulga — você vê de onde cada cadastro veio" headingLevel={3}>
        <Toolbar>
          <Input value={campanha} onChange={(e) => setCampanha(e.target.value)} placeholder="instagram, evento, whatsapp…" aria-label="Campanha" list="hg-campanhas" />
          <datalist id="hg-campanhas">{CAMPANHAS.map((c) => <option key={c} value={c} />)}</datalist>
          <Button variant="cyan" icon="mais" onClick={criarLink}>Criar link</Button>
        </Toolbar>
        {links.length ? (
          <ul className="hg-links">
            {links.map((l) => (
              <li key={l.campanha}>
                <span className="hg-links-tag">{l.campanha}</span>
                <code>{l.url}</code>
                <div className="hg-links-acoes">
                  <Button variant="ghost" onClick={() => copiar(l.url)}>Copiar</Button>
                  <button className="hg-x" onClick={() => setLinks(links.filter((x) => x.campanha !== l.campanha))} aria-label={"Apagar link " + l.campanha}><Icon name="x" /></button>
                </div>
              </li>
            ))}
          </ul>
        ) : <EmptyState icon="link" title="Nenhum link de campanha" description="Crie um link por canal (Instagram, WhatsApp, evento) para comparar os resultados." />}
        <Toolbar style={{ marginTop: ".6rem" }}>
          <Button variant="ghost" icon="grafico" onClick={() => ir("meus-acessos.html")}>Ver meus indicados</Button>
        </Toolbar>
      </Panel>
      {aviso ? <Toast open>{aviso}</Toast> : null}
    </>
  );
}

Object.assign(window, { PerfilScreen });

})();
</script>

<script type="text/babel" data-presets="react">
/* RedeCompletaScreen.jsx */
(() => {
const { PageHead, Panel, Button, Input, Select, Icon, Stars, Pill, Avatar, EmptyState } = window.BabelOSDesignSystem_5ad360;

/* Rede Completa — todas as empresas do Reino como cartões.
   Toque num cartão para expandir: reputação, guilda, posição no ranking,
   conexões (empresas do mesmo nicho/cidade) e "Ver no mapa" (voa até a cidade). */
const GUILDA_POR_REGIAO = { Sudeste: "Guilda Paulista", Sul: "Guilda Araucária", "Centro-Oeste": "Guilda Planalto", Nordeste: "Guilda do Nordeste", Norte: "Guilda da Amazônia" };
const TITULO_POR_ABR = { Nacional: "Rei", Regional: "Príncipe", Estadual: "Duque", Local: "Conde" };
const fmt = (n) => Number(n || 0).toLocaleString("pt-BR");

function RedeCompletaScreen({ ir }) {
  const d = window.BABEL_DEMO;
  const [q, setQ] = React.useState("");
  const [regiao, setRegiao] = React.useState("");
  const [nicho, setNicho] = React.useState("");
  const [ordem, setOrdem] = React.useState("nota");
  const [aberta, setAberta] = React.useState(null);
  const [limite, setLimite] = React.useState(24);
  /* 15 mil empresas na demonstração: o ranking é calculado uma vez e a lista mostra até 24 por vez */
  const base = React.useMemo(() => (window.BabelDemo ? window.BabelDemo("reino/empresas", {}) : []), []);
  const total = base.length;
  const nichos = React.useMemo(() => [...new Set(base.map((e) => e.nicho).filter(Boolean))].sort(), [base]);
  // ranking geral por nota e volume de avaliações (posição estável)
  const ordenadas = React.useMemo(() => {
    // chave numérica pré-calculada: ordena 15 mil itens uma única vez, sem comparador caro
    const ks = base.map((e, i) => [(e.nota || 0) * 1000 + Math.min(999, e.avaliacoes || 0), i]);
    ks.sort((a, b) => b[0] - a[0]);
    const ord = new Array(ks.length); const pos = {};
    for (let r = 0; r < ks.length; r++) { const e = base[ks[r][1]]; ord[r] = e; pos[e.id] = r + 1; }
    return { ord, pos };
  }, [base]);
  const ranking = ordenadas.pos;
  const lista = React.useMemo(() => {
    const t = q.trim().toLowerCase();
    const fonte = ordem === "nota" ? ordenadas.ord : base;
    const f = fonte.filter((e) => (!t || (e.nome || "").toLowerCase().includes(t) || (e.cidade || "").toLowerCase().includes(t)) && (!regiao || e.regiao === regiao) && (!nicho || e.nicho === nicho));
    if (ordem === "avaliacoes") f.sort((a, b) => (b.avaliacoes || 0) - (a.avaliacoes || 0));
    else if (ordem === "nome") f.sort((a, b) => (a.nome < b.nome ? -1 : a.nome > b.nome ? 1 : 0));
    return f;
  }, [base, q, regiao, nicho, ordem, ordenadas]);
  React.useEffect(() => { setLimite(24); }, [q, regiao, nicho, ordem]);
  React.useEffect(() => { if (window.ReinoFotos) window.ReinoFotos.sincronizar(lista.slice(0, limite).map((e) => e.id)); }, [lista, limite]);

  const conexoes = (e) => { const out = []; for (const x of base) { if (x.id !== e.id && ((x.nicho === e.nicho && x.uf === e.uf) || x.cidade === e.cidade)) { out.push(x); if (out.length === 4) break; } } return out; };
  const verNoMapa = (e) => { window.__destinoMapa = { uf: e.uf, cidade: e.cidade, bairro: e.bairro }; ir("mapa.html"); };
  const regioes = d.regioes.map((r) => r.nome);

  return (
    <>
      <PageHead title="Rede Completa" subtitle={fmt(total) + " empresas em todo o Reino, por região, nicho e reputação."}>
        <div className="hg-head-acoes">
          <Pill as="span"><Icon name="social" size={13} /> {fmt(lista.length)} de {fmt(total)}</Pill>
        </div>
      </PageHead>

      <div className="hg-rc-filtros" role="search">
        <label className="hg-rc-busca"><Icon name="busca" /><Input type="search" placeholder="Empresa ou cidade" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Buscar" /></label>
        <div className="hg-rc-chips" aria-label="Região">
          <button type="button" aria-pressed={!regiao} onClick={() => setRegiao("")}>Todas</button>
          {regioes.map((r) => <button key={r} type="button" aria-pressed={regiao === r} onClick={() => setRegiao(regiao === r ? "" : r)}>{r}</button>)}
        </div>
        <div className="hg-rc-linha">
          <Select value={nicho} onChange={(e) => setNicho(e.target.value)} aria-label="Nicho"><option value="">Todos os nichos</option>{nichos.map((n) => <option key={n}>{n}</option>)}</Select>
          <Select value={ordem} onChange={(e) => setOrdem(e.target.value)} aria-label="Ordenar"><option value="nota">Melhor reputação</option><option value="avaliacoes">Mais avaliadas</option><option value="nome">Nome A–Z</option></Select>
        </div>
      </div>

      {lista.length === 0 ? (
        <Panel><EmptyState icon="social" title="Nenhuma empresa encontrada" description="Ajuste a busca, a região ou o nicho." /></Panel>
      ) : (
        <div className="hg-rc-grade">
          {lista.slice(0, limite).map((e, i) => {
            const on = aberta === e.id;
            const pos = ranking[e.id];
            const guilda = GUILDA_POR_REGIAO[e.regiao] || "Sem guilda";
            const titulo = TITULO_POR_ABR[e.abrangencia] || "Barão";
            const con = on ? conexoes(e) : [];
            return (
              <article key={e.id} className={"hg-rc-card" + (on ? " is-aberto" : "") + (pos <= 3 ? " is-top" : "")} style={{ "--i": i % 24 }}>
                <button type="button" className="hg-rc-topo" onClick={() => setAberta(on ? null : e.id)} aria-expanded={on}>
                  <span className="hg-rc-pos" title={"Posição no ranking do Reino"}>{pos <= 3 ? <Icon name="coroa" /> : null}#{pos}</span>
                  <FotoAvatar chave={e.id} nome={e.nome} gradient={pos <= 3 ? "match" : "brand"} size={44} editavel />
                  <div className="hg-rc-txt">
                    <strong>{e.nome}</strong>
                    <span>{e.nicho} · {e.cidade} · {e.uf}</span>
                    <span className="hg-rc-nota"><Stars value={e.nota} /><b>{Number(e.nota || 0).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</b><small>({fmt(e.avaliacoes)})</small></span>
                  </div>
                  <Icon name="mais" />
                </button>
                {on ? (
                  <div className="hg-rc-detalhe">
                    <dl className="hg-rc-fatos">
                      <div><dt><Icon name="guilda" />Guilda</dt><dd>{guilda}</dd></div>
                      <div><dt><Icon name="coroa" />Título</dt><dd>{titulo} · {e.abrangencia}</dd></div>
                      <div><dt><Icon name="trofeu" />Posição</dt><dd>#{pos} de {fmt(total)}</dd></div>
                      <div><dt><Icon name="estrela" />Reputação</dt><dd>{Number(e.nota || 0).toLocaleString("pt-BR", { minimumFractionDigits: 1 })} em {fmt(e.avaliacoes)} avaliações</dd></div>
                    </dl>
                    <div className="hg-rc-con">
                      <p className="hg-globo-sobre">Conexões · {con.length}</p>
                      {con.length ? (
                        <ul>{con.map((c) => (
                          <li key={c.id}><button type="button" onClick={() => setAberta(c.id)}><FotoAvatar chave={c.id} nome={c.nome} size={26} /><span>{c.nome}</span><small>{c.nicho === e.nicho ? "mesmo nicho" : "mesma cidade"}</small></button></li>
                        ))}</ul>
                      ) : <p className="hg-sub">Ainda sem conexões próximas.</p>}
                    </div>
                    <div className="hg-rc-acoes">
                      <Button variant="cyan" icon="mapa" onClick={() => verNoMapa(e)}>Ver no mapa</Button>
                      <Button variant="ghost" icon="match" onClick={() => ir("chat.html")}>Fazer network</Button>
                    </div>
                  </div>
                ) : null}
              </article>
            );
          })}
        </div>
      )}
      {lista.length > limite ? (
        <div className="hg-rc-mais"><Button variant="ghost" onClick={() => setLimite((n) => n + 24)}>Mostrar mais {fmt(Math.min(24, lista.length - limite))} de {fmt(lista.length - limite)}</Button></div>
      ) : null}
    </>
  );
}

Object.assign(window, { RedeCompletaScreen });

})();
</script>
<script type="text/babel" data-presets="react">
/* AcessosScreen.jsx */
(() => {
const { PageHead, Panel, Button, Input, KpiCard, Pill, Avatar, Icon, LineChart, EmptyState, AffiliateLevel } = window.BabelOSDesignSystem_5ad360;

/* Meus acessos — painel REAL do afiliado (afiliados.js + Supabase).
   Link /r/<codigo>: cliques, cadastros com cidade/UF/título/dispositivo, comissão
   por título, gráfico por dia e ranking. Sem Supabase configurado, mostra o que
   este navegador registrou e avisa. */
const brl = (n) => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const quando = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };

function AcessosScreen() {
  const d = window.BABEL_DEMO;
  const A = window.ReinoAfiliados;
  const codigo = A.meuCodigo(d.perfil.nome);
  const [p, setP] = React.useState(null);
  const [copiado, setCopiado] = React.useState(false);
  const [aba, setAba] = React.useState("todos");
  const carregar = React.useCallback(() => A.painel(codigo).then(setP), [codigo]);
  React.useEffect(() => { carregar(); }, [carregar]);
  const copiar = async () => { try { await navigator.clipboard.writeText(p.link); setCopiado(true); setTimeout(() => setCopiado(false), 1600); } catch (e) {} };
  const compartilhar = () => { if (navigator.share) navigator.share({ title: "Entre no Reino", text: "Vem para o Reino pelo meu link:", url: p.link }).catch(() => {}); else copiar(); };
  if (!p) return <PageHead title="Meus acessos e estatísticas" subtitle="Carregando…" />;
  // cadastros podem vir de cliques não contados (outra sessão): a conversão não passa de 100%
  const conv = p.cliques.length ? Math.min(100, Math.round((p.cadastros.length / Math.max(p.cliques.length, p.cadastros.length)) * 100)) : null;
  const nivel = p.cadastros.length >= 10 ? "Ouro" : p.cadastros.length >= 3 ? "Prata" : "Bronze";
  const proximo = p.cadastros.length >= 10 ? "nível máximo" : "faltam " + ((p.cadastros.length >= 3 ? 10 : 3) - p.cadastros.length) + " para " + (p.cadastros.length >= 3 ? "Ouro" : "Prata");
  const porTitulo = Object.entries(p.cadastros.reduce((m, c) => { const t = c.titulo || "Sem título"; m[t] = (m[t] || 0) + 1; return m; }, {})).sort((a, b) => (A.COMISSAO[b[0]] || 0) - (A.COMISSAO[a[0]] || 0));
  const lista = aba === "cadastrou" ? p.cadastros.map((c) => ({ ...c, tipo: "cadastro" })) : aba === "clicou" ? p.cliques.filter((c) => !c.cadastrou).map((c) => ({ ...c, tipo: "clique" }))
    : [...p.cadastros.map((c) => ({ ...c, tipo: "cadastro" })), ...p.cliques.filter((c) => !c.cadastrou).map((c) => ({ ...c, tipo: "clique" }))].sort((a, b) => (b.criado_em || "").localeCompare(a.criado_em || ""));
  return (
    <>
      <PageHead title="Meus acessos e estatísticas" subtitle="Quem clicou no seu link, quem se cadastrou e quanto isso rendeu.">
        <div className="hg-head-acoes"><AffiliateLevel level={nivel} indicados={p.cadastros.length} proximo={proximo} progress={Math.min(100, (p.cadastros.length / 10) * 100)} compact /></div>
      </PageHead>

      {!p.online ? <p className="hg-af-aviso"><Icon name="alerta" />Banco ainda não conectado: os registros ficam só neste navegador. Cole a chave do Supabase em <code>index.html</code> (veja <code>afiliados.sql</code>).</p> : null}

      <Panel tone="afiliado" title="Seu link de afiliado" subtitle="Quem entrar por ele fica ligado a você para sempre." headingLevel={3}>
        <div className="hg-af-link">
          <Input readOnly value={p.link} aria-label="Seu link" onFocus={(e) => e.target.select()} />
          <Button variant="green" icon="link" onClick={copiar}>{copiado ? "Copiado!" : "Copiar"}</Button>
          <Button variant="ghost" icon="rota" onClick={compartilhar}>Compartilhar</Button>
        </div>
        <p className="hg-sub" style={{ marginTop: ".5rem" }}>Código <b style={{ color: "#fff" }}>{p.codigo}</b>{p.rotaR ? <> · também funciona como <code>?ref={p.codigo}</code></> : <> · com domínio próprio o link fica curto: <code>{p.linkCurto}</code> (precisa do <code>vercel.json</code>)</>}</p>
      </Panel>

      <section className="hg-kpis" aria-label="Resumo">
        <KpiCard label="Cliques no link" value={p.cliques.length.toLocaleString("pt-BR")} foot="total" />
        <KpiCard label="Cadastros" value={p.cadastros.length.toLocaleString("pt-BR")} foot="pelo seu link" />
        <KpiCard label="Conversão" value={conv == null ? undefined : conv} suffix={conv == null ? undefined : "%"} empty={conv == null} foot={conv == null ? "sem cliques ainda" : "cliques → cadastros"} />
        <KpiCard label="Comissão" value={brl(p.comissao)} foot={Math.round(A.PCT * 100) + "% da 1ª mensalidade"} size="1.4rem" />
      </section>

      <div className="hg-duas">
        <Panel tone="reputacao" title="Indicações por dia" subtitle="Últimos 14 dias · cadastros" headingLevel={3}>
          {p.porDia.some((x) => x.cadastros || x.cliques) ? (
            <LineChart points={p.porDia.map((x) => x.cadastros)} labels={p.porDia.map((x) => x.dia.slice(8) + "/" + x.dia.slice(5, 7))} highlight={String(p.porDia[p.porDia.length - 1].cadastros)} />
          ) : <EmptyState icon="grafico" title="Nenhuma indicação ainda" description="Compartilhe seu link: cada cadastro aparece aqui no mesmo dia." />}
        </Panel>
        <Panel title="Comissão por título" subtitle="Quanto cada título escolhido pelos indicados rende" headingLevel={3}>
          {porTitulo.length ? (
            <ul className="hg-af-titulos">
              {porTitulo.map(([t, n]) => (
                <li key={t}><span className="hg-af-coroa"><Icon name="coroa" /></span><div><strong>{t}</strong><span>{n} {n === 1 ? "indicado" : "indicados"} · {brl(A.COMISSAO[t] || 0)}/mês cada</span></div><b>{brl((A.COMISSAO[t] || 0) * A.PCT * n)}</b></li>
              ))}
            </ul>
          ) : <p className="hg-sub">Imperador {brl(997)} · Rei {brl(497)} · Príncipe {brl(247)} · Duque {brl(97)} · Marquês {brl(77)} · Conde {brl(67)} · Visconde {brl(57)} · Barão {brl(47)}. Você recebe {Math.round(A.PCT * 100)}% da primeira mensalidade de cada indicado.</p>}
        </Panel>
      </div>

      <div className="hg-duas">
        <Panel fill title="Indicados" subtitle={p.cadastros.length + " cadastraram · " + p.cliques.filter((c) => !c.cadastrou).length + " só clicaram"} headingLevel={3}
          actions={<div className="hg-tabs" role="tablist">{[["todos", "Todos"], ["cadastrou", "Cadastrou"], ["clicou", "Clicou"]].map(([v, r]) => <button key={v} role="tab" aria-selected={aba === v} onClick={() => setAba(v)}>{r}</button>)}</div>}>
          {lista.length ? (
            <ul className="hg-list">
              {lista.slice(0, 50).map((c) => (
                <li className="hg-row" key={c.id}>
                  <Avatar name={c.tipo === "cadastro" ? c.nome : "?"} gradient={c.tipo === "cadastro" ? "brand" : undefined} />
                  <div>
                    <strong>{c.tipo === "cadastro" ? c.nome : "Visitante"}</strong>
                    <span>{c.tipo === "cadastro" ? [c.titulo, [c.cidade, c.uf].filter(Boolean).join(" · "), c.dispositivo].filter(Boolean).join(" · ") : ["clicou no link", [c.cidade, c.uf].filter(Boolean).join(" · ") || null, c.dispositivo, c.origem ? "vindo de " + new URL(c.origem).hostname : null].filter(Boolean).join(" · ")}</span>
                  </div>
                  <div style={{ display: "grid", justifyItems: "end", gap: ".2rem" }}>
                    <Pill as="span" className={c.tipo === "cadastro" ? "" : "is-fraca"}>{c.tipo === "cadastro" ? "cadastrou" : "clicou"}</Pill>
                    <time className="hg-sub">{quando(c.criado_em)}</time>
                  </div>
                </li>
              ))}
            </ul>
          ) : <EmptyState icon="link" title="Ninguém entrou pelo seu link ainda" description="Copie o link acima e mande para quem você quer trazer para o Reino." />}
        </Panel>
        <Panel title="Ranking de afiliados" subtitle="Quem mais trouxe gente para o Reino" headingLevel={3}>
          {p.ranking.length ? (
            <ol className="hg-titulos">
              {p.ranking.map((r, i) => (
                <li key={r.codigo}><span className="hg-rank">{i + 1}</span><div><strong className={r.codigo === p.codigo ? "hg-gold" : ""}>{r.codigo}{r.codigo === p.codigo ? " (você)" : ""}</strong><span>{r.cadastros} {r.cadastros === 1 ? "cadastro" : "cadastros"}</span></div><b>{brl(r.cadastros * 97 * A.PCT)}+</b></li>
              ))}
            </ol>
          ) : <p className="hg-sub">{p.online ? "O ranking aparece quando houver cadastros." : "O ranking compara todos os afiliados e precisa do banco conectado."}</p>}
        </Panel>
      </div>
    </>
  );
}

Object.assign(window, { AcessosScreen });

})();
</script>
<script type="text/babel" data-presets="react">
/* AdminScreen.jsx */

/* Contas no banco — lê de verdade o Supabase (perfis, codigos, cliques, cadastros)
   e deixa o administrador aprovar ou recusar quem acabou de se cadastrar.
   Sem chave configurada, avisa em vez de inventar dados. */
(() => {
const { PageHead, Panel, Button, Input, KpiCard, Avatar, EmptyState } = window.BabelOSDesignSystem_5ad360;
const quando = (iso) => { const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }); };
const th = { textAlign: "left", padding: ".5rem .7rem", fontSize: ".72rem", textTransform: "uppercase", letterSpacing: ".06em", opacity: .62, whiteSpace: "nowrap", borderBottom: "1px solid rgba(255,255,255,.14)" };
const td = { padding: ".6rem .7rem", fontSize: ".86rem", borderBottom: "1px solid rgba(255,255,255,.07)", verticalAlign: "middle", whiteSpace: "nowrap" };
const PENDENTE = { aguardando: 1, "pre-cadastro": 1 };
const COR = { admin: { cor: "#ffd97a", borda: "rgba(255,217,122,.45)" }, membro: { cor: "#7ef2b0", borda: "rgba(126,242,176,.4)" }, aguardando: { cor: "#7ad7ff", borda: "rgba(122,215,255,.45)" }, recusado: { cor: "#ff9aa8", borda: "rgba(255,154,168,.4)" } };
const rotulo = { aguardando: "aguardando aprovação", "pre-cadastro": "aguardando aprovação", membro: "aprovado", admin: "administrador", recusado: "recusado" };

function Selo({ s }) {
  const c = COR[s] || COR[PENDENTE[s] ? "aguardando" : ""] || null;
  return <b className="hg-pill" style={c ? { color: c.cor, borderColor: c.borda } : undefined}>{rotulo[s] || s || "—"}</b>;
}

function AdminScreen() {
  const cfg = window.REINO_SUPABASE;
  const online = !!(cfg && cfg.url && cfg.anon);
  const [dados, setDados] = React.useState(null);
  const [erro, setErro] = React.useState(null);
  const [busca, setBusca] = React.useState("");
  const [recarga, setRecarga] = React.useState(0);
  const [mexendo, setMexendo] = React.useState(null);

  const base = online ? cfg.url.replace(/\/$/, "") + "/rest/v1/" : "";
  const cab = online ? { apikey: cfg.anon, Authorization: "Bearer " + cfg.anon } : null;

  React.useEffect(() => {
    if (!online) return;
    let vivo = true;
    const pega = (q) => fetch(base + q, { headers: cab }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    Promise.all([
      pega("perfis?select=*&order=criado_em.desc"),
      pega("codigos?select=codigo,user_id,nome"),
      pega("cliques?select=codigo,cadastrou"),
      pega("cadastros?select=codigo,nome,email,titulo,cidade,uf,criado_em&order=criado_em.desc"),
    ]).then(([perfis, codigos, cliques, cadastros]) => {
      if (!vivo) return;
      if (!Array.isArray(perfis)) return setErro("Não foi possível ler a tabela perfis.");
      const porUser = {}; (codigos || []).forEach((c) => { porUser[c.user_id] = c.codigo; });
      const stat = {}; (cliques || []).forEach((c) => { const s = stat[c.codigo] || (stat[c.codigo] = { cliques: 0, cadastros: 0 }); s.cliques++; if (c.cadastrou) s.cadastros++; });
      setDados({ perfis, porUser, stat, cadastros: Array.isArray(cadastros) ? cadastros : [] });
    });
    return () => { vivo = false; };
  }, [online, recarga]);

  const decidir = async (p, nova) => {
    setMexendo(p.id);
    try {
      const r = await fetch(base + "perfis?id=eq." + p.id, { method: "PATCH", headers: { ...cab, "Content-Type": "application/json", Prefer: "return=representation" }, body: JSON.stringify({ situacao: nova }) });
      if (!r.ok) throw new Error(await r.text());
      setDados((d) => ({ ...d, perfis: d.perfis.map((x) => (x.id === p.id ? { ...x, situacao: nova } : x)) }));
    } catch (e) { setErro("Não foi possível gravar a mudança. " + String(e.message || e).slice(0, 120)); }
    setMexendo(null);
  };

  const cabeca = <PageHead title="Contas no banco" subtitle="Quem já criou conta de verdade no Reino — lido direto do Supabase." />;
  if (!online) return <>{cabeca}<Panel fill><EmptyState icon="alerta" title="Banco não conectado" description="Cole a URL e a chave publicável do Supabase em window.REINO_SUPABASE para ver as contas reais." /></Panel></>;
  if (!dados) return erro
    ? <>{cabeca}<Panel fill><EmptyState icon="alerta" title="Leitura bloqueada" description={erro + " Confira as políticas de leitura (RLS) em afiliados.sql."} /></Panel></>
    : <PageHead title="Contas no banco" subtitle="Carregando…" />;

  const t = busca.trim().toLowerCase();
  const casa = (p) => !t || [p.nome, p.email, p.cidade, p.uf, dados.porUser[p.id]].some((v) => String(v || "").toLowerCase().includes(t));
  const pendentes = dados.perfis.filter((p) => PENDENTE[p.situacao] && casa(p));
  const resto = dados.perfis.filter((p) => !PENDENTE[p.situacao] && casa(p));
  const aprovados = dados.perfis.filter((p) => p.situacao === "membro" || p.situacao === "admin").length;

  const Linha = ({ p, acoes }) => {
    const cod = dados.porUser[p.id];
    const s = (cod && dados.stat[cod]) || { cliques: 0, cadastros: 0 };
    return (
      <tr>
        <td style={td}>
          <div style={{ display: "flex", alignItems: "center", gap: ".55rem" }}>
            <Avatar name={p.nome || p.email || "?"} />
            <div style={{ display: "grid", lineHeight: 1.25 }}>
              <strong>{p.nome || "sem nome"}</strong>
              <span style={{ fontSize: ".76rem", opacity: .6 }}>{p.email || "—"}</span>
            </div>
          </div>
        </td>
        <td style={td}><Selo s={p.situacao} /></td>
        <td style={td}>{p.cidade ? p.cidade + (p.uf ? " · " + p.uf : "") : "—"}</td>
        <td style={td}>{cod ? <code>{cod}</code> : <span style={{ opacity: .4 }}>—</span>}</td>
        <td style={td}>{s.cliques}</td>
        <td style={td}>{s.cadastros}</td>
        <td style={{ ...td, opacity: .7 }}>{quando(p.criado_em)}</td>
        {acoes ? (
          <td style={td}>
            <div style={{ display: "flex", gap: ".4rem" }}>
              <Button variant="green" disabled={mexendo === p.id} onClick={() => decidir(p, "membro")}>{mexendo === p.id ? "…" : "Aprovar"}</Button>
              <Button variant="ghost" disabled={mexendo === p.id} onClick={() => decidir(p, "recusado")}>Recusar</Button>
            </div>
          </td>
        ) : null}
      </tr>
    );
  };

  return (
    <>
      <PageHead title="Contas no banco" subtitle="Quem já criou conta de verdade no Reino — lido direto do Supabase.">
        <div className="hg-head-acoes"><Button variant="ghost" icon="rota" onClick={() => { setDados(null); setErro(null); setRecarga((n) => n + 1); }}>Atualizar</Button></div>
      </PageHead>

      {erro ? <p className="hg-af-aviso">{erro}</p> : null}

      <section className="hg-kpis" aria-label="Resumo das contas">
        <KpiCard label="Aguardando aprovação" value={String(dados.perfis.filter((p) => PENDENTE[p.situacao]).length)} foot="esperando você" />
        <KpiCard label="Aprovados" value={String(aprovados)} foot="membros e admins" />
        <KpiCard label="Contas criadas" value={String(dados.perfis.length)} foot="tabela perfis" />
        <KpiCard label="Cadastros por link" value={String(dados.cadastros.length)} foot="tabela cadastros" />
      </section>

      <Panel tone="afiliado" title="Esperando aprovação" subtitle={pendentes.length ? pendentes.length + " conta(s) para você liberar" : "Nada na fila."} headingLevel={3}>
        {!pendentes.length ? <EmptyState icon="clientes" title="Fila vazia" description="Toda conta nova aparece aqui até você aprovar." /> : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr><th style={th}>Pessoa</th><th style={th}>Situação</th><th style={th}>Cidade</th><th style={th}>Código</th><th style={th}>Cliques</th><th style={th}>Cadastros</th><th style={th}>Criada em</th><th style={th}>Decisão</th></tr></thead>
              <tbody>{pendentes.map((p) => <Linha key={p.id} p={p} acoes />)}</tbody>
            </table>
          </div>
        )}
      </Panel>

      <Panel title="Todas as contas" subtitle={resto.length + " já decidida(s)"} headingLevel={3}
        actions={<Input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar nome, e-mail, cidade ou código" aria-label="Buscar conta" />}>
        {!resto.length ? <EmptyState icon="clientes" title="Nenhuma conta aqui" description={dados.perfis.length ? "Nada casa com a busca." : "Crie a primeira conta pela tela de cadastro."} /> : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr><th style={th}>Pessoa</th><th style={th}>Situação</th><th style={th}>Cidade</th><th style={th}>Código</th><th style={th}>Cliques</th><th style={th}>Cadastros</th><th style={th}>Criada em</th></tr></thead>
              <tbody>{resto.map((p) => <Linha key={p.id} p={p} />)}</tbody>
            </table>
          </div>
        )}
      </Panel>

      {dados.cadastros.length ? (
        <Panel title="Cadastros que entraram por link" subtitle="Tabela cadastros — quem veio de um código de afiliado." headingLevel={3}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr><th style={th}>Nome</th><th style={th}>E-mail</th><th style={th}>Título</th><th style={th}>Cidade</th><th style={th}>Veio de</th><th style={th}>Quando</th></tr></thead>
              <tbody>
                {dados.cadastros.map((c, i) => (
                  <tr key={i}>
                    <td style={td}><strong>{c.nome || "—"}</strong></td>
                    <td style={td}>{c.email || "—"}</td>
                    <td style={td}>{c.titulo || "—"}</td>
                    <td style={td}>{c.cidade ? c.cidade + (c.uf ? " · " + c.uf : "") : "—"}</td>
                    <td style={td}>{c.codigo ? <code>{c.codigo}</code> : <span style={{ opacity: .4 }}>direto</span>}</td>
                    <td style={{ ...td, opacity: .7 }}>{quando(c.criado_em)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Panel>
      ) : null}
    </>
  );
}

Object.assign(window, { AdminScreen });
})();
</script>
<script type="text/babel" data-presets="react">
/* ChatScreen.jsx */
(() => {
const { Button, Avatar, Icon, Pill } = window.BabelOSDesignSystem_5ad360;

/* Bate Papo do Reino — um grupo só, estilo WhatsApp.
   Toque numa mensagem → "Fazer network" → pedido vai para as notificações da
   outra pessoa → ela aceita → convite de chat privado → conversa 1:1.
   Na demonstração o outro lado responde sozinho depois de alguns segundos. */
const TITULO_CHAT = { "Ana Ribeiro": "Rei", "Camila Duarte": "Duque", "Eduarda Lopes": "Conde", "Henrique Alves": "Príncipe", "Gabriela Rocha": "Duque", "Felipe Nunes": "Duque", "Diego Martins": "Barão" };
const GRUPO_INICIAL = [
  { id: 1, de: "Ana Ribeiro", empresa: "Pulso Marketing Digital", texto: "Bom dia, Reino! Alguém de contabilidade em Campinas para uma parceria?", quando: "09:02" },
  { id: 2, de: "Felipe Nunes", empresa: "Orla Saúde Integrada", texto: "Aqui no Rio estamos fechando campanha de check-up. Se alguém tiver agência boa, indica.", quando: "09:05" },
  { id: 3, de: "Camila Duarte", empresa: "Pinheiro Tech Solutions", texto: "@Ana Ribeiro conheço a Conta Certa, são ótimos. Posso apresentar.", quando: "09:07" },
  { id: 4, de: "Henrique Alves", empresa: "Planalto Consultoria", texto: "A Guilda Planalto abriu 3 vagas para escritórios do Centro-Oeste. Quem quiser, me chama.", quando: "09:11" },
  { id: 5, de: "Eduarda Lopes", empresa: "Capibaribe Clínica", texto: "Inauguramos a unidade da Boa Vista ontem. Obrigada a quem passou por lá!", quando: "09:15" },
  { id: 6, de: "Gabriela Rocha", empresa: "Pampa Marketing", texto: "Case novo: +38% de leads pra uma imobiliária em 60 dias. Quem quiser o passo a passo, fala comigo.", quando: "09:18" },
];
const horaAgora = () => new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

function ChatScreen() {
  const d = window.BABEL_DEMO;
  const eu = d.perfil.nome;
  const podeFalar = d.regras.chatFala.includes(d.perfil.titulo);
  const [grupo, setGrupo] = React.useState(GRUPO_INICIAL);
  const [privados, setPrivados] = React.useState({}); // nome -> mensagens
  const [aberto, setAberto] = React.useState("grupo"); // "grupo" | nome
  const [selecionada, setSelecionada] = React.useState(null); // id da mensagem tocada
  const [pedidos, setPedidos] = React.useState([]); // {de, estado: "enviado"|"aceito"|"convite"|"recebido"}
  const [notifAberta, setNotifAberta] = React.useState(false);
  const [texto, setTexto] = React.useState("");
  const [menuMobile, setMenuMobile] = React.useState(false);
  const fim = React.useRef(null);

  React.useEffect(() => { fim.current && fim.current.scrollIntoView && fim.current.scrollTo && 0; const el = fim.current; if (el && el.parentElement) el.parentElement.scrollTop = el.parentElement.scrollHeight; }, [grupo, privados, aberto]);

  // pedido recebido de fora, para mostrar o outro lado do fluxo
  React.useEffect(() => {
    const t = setTimeout(() => setPedidos((p) => (p.some((x) => x.de === "Diego Martins") ? p : [...p, { de: "Diego Martins", empresa: "Martins Logística", estado: "recebido", quando: horaAgora() }])), 6000);
    return () => clearTimeout(t);
  }, []);

  const pedirNetwork = (nome, empresa) => {
    setSelecionada(null);
    setPedidos((p) => (p.some((x) => x.de === nome) ? p : [...p, { de: nome, empresa, estado: "enviado", quando: horaAgora() }]));
    // demonstração: a outra pessoa aceita em ~4s e o convite de chat privado chega
    setTimeout(() => setPedidos((p) => p.map((x) => (x.de === nome && x.estado === "enviado" ? { ...x, estado: "convite", quando: horaAgora() } : x))), 4000);
  };
  const aceitarRecebido = (nome) => setPedidos((p) => p.map((x) => (x.de === nome ? { ...x, estado: "convite" } : x)));
  const recusar = (nome) => setPedidos((p) => p.filter((x) => x.de !== nome));
  const abrirPrivado = (nome) => {
    setPedidos((p) => p.map((x) => (x.de === nome ? { ...x, estado: "aceito" } : x)));
    setPrivados((pv) => (pv[nome] ? pv : { ...pv, [nome]: [{ de: nome, texto: "Oi! Vi seu pedido de network. Vamos conversar?", quando: horaAgora() }] }));
    setAberto(nome); setNotifAberta(false); setMenuMobile(false);
  };
  const enviar = (e) => {
    e.preventDefault();
    const t = texto.trim(); if (!t) return;
    const msg = { id: Date.now(), de: eu, empresa: "Você", texto: t, quando: horaAgora() };
    if (aberto === "grupo") setGrupo((g) => [...g, msg]); else setPrivados((pv) => ({ ...pv, [aberto]: [...(pv[aberto] || []), msg] }));
    setTexto("");
  };

  const pendentes = pedidos.filter((p) => p.estado !== "aceito");
  const conversas = [{ id: "grupo", nome: "Bate Papo do Reino", sub: `${new Set(grupo.map((m) => m.de)).size} participantes · todos os títulos`, ultima: grupo[grupo.length - 1].texto, quando: grupo[grupo.length - 1].quando, grupo: true },
    ...Object.keys(privados).map((n) => { const ms = privados[n]; return { id: n, nome: n, sub: TITULO_CHAT[n] || "Membro", ultima: ms[ms.length - 1].texto, quando: ms[ms.length - 1].quando }; })];
  const msgs = aberto === "grupo" ? grupo : privados[aberto] || [];
  const conversaAtual = conversas.find((c) => c.id === aberto) || conversas[0];

  return (
    <div className={"hg-zap" + (menuMobile ? " is-lista" : "")}>
      {/* coluna de conversas */}
      <aside className="hg-zap-lista">
        <div className="hg-zap-lista-topo">
          <Avatar name={eu} />
          <strong>Bate Papo</strong>
          <button type="button" className="hg-zap-sino" onClick={() => setNotifAberta((v) => !v)} aria-label="Notificações de network" aria-expanded={notifAberta}>
            <Icon name="sino" />{pendentes.length ? <b>{pendentes.length}</b> : null}
          </button>
        </div>
        <label className="hg-zap-busca"><Icon name="busca" /><input type="search" placeholder="Pesquisar conversa" /></label>
        <ul className="hg-zap-conversas">
          {conversas.map((c) => (
            <li key={c.id}>
              <button type="button" className={aberto === c.id ? "is-on" : ""} onClick={() => { setAberto(c.id); setMenuMobile(false); }}>
                {c.grupo ? <span className="hg-zap-grupo-ico"><Icon name="coroa" /></span> : <Avatar name={c.nome} />}

          <span className="hg-zap-dia">Hoje</span>
          {msgs.map((m, i) => {
            const minha = m.de === eu;
            const anterior = msgs[i - 1];

            const jaPedi = pedidos.some((p) => p.de === m.de);
            return (
              <div key={m.id || i} className={"hg-zap-msg" + (minha ? " is-eu" : "") + (mesmoAutor ? " is-seq" : "") + (selecionada === m.id ? " is-sel" : "")}>

                <div className="hg-zap-bolha" onClick={(e) => { e.stopPropagation(); if (!minha && aberto === "grupo") setSelecionada(selecionada === m.id ? null : m.id); }} role={!minha && aberto === "grupo" ? "button" : undefined} tabIndex={!minha && aberto === "grupo" ? 0 : undefined}>
                  {!minha && !mesmoAutor ? <header><strong>{m.de}</strong>{TITULO_CHAT[m.de] ? <em>{TITULO_CHAT[m.de]}</em> : null}{m.empresa ? <small>{m.empresa}</small> : null}</header> : null}
                  <p>{m.texto}</p>
                  <time>{m.quando}{minha ? <Icon name="link" /> : null}</time>
                  {selecionada === m.id ? (
                    <div className="hg-zap-acoes" onClick={(e) => e.stopPropagation()}>
                      {jaPedi ? <span className="hg-sub">Pedido de network enviado</span> : <Button variant="cyan" icon="match" onClick={() => pedirNetwork(m.de, m.empresa)}>Fazer network</Button>}
                      <Button variant="ghost" onClick={() => setSelecionada(null)}>Cancelar</Button>
                    </div>
                  ) : null}
                </div>
              </div>
            );
          })}
          <div ref={fim} />
        </div>

        {podeFalar ? (
          <form className="hg-zap-compor" onSubmit={enviar}>
            <button type="button" aria-label="Anexar"><Icon name="mais" /></button>
            <input value={texto} onChange={(e) => setTexto(e.target.value)} placeholder={aberto === "grupo" ? "Mensagem para o Reino" : "Mensagem para " + aberto} aria-label="Mensagem" />
            <button type="submit" className="hg-zap-enviar" aria-label="Enviar" disabled={!texto.trim()}><Icon name="rota" /></button>
          </form>
        ) : (
          <p className="hg-chat-aviso" style={{ margin: ".6rem" }}><Icon name="coroa" />Só Marquês para cima envia mensagem no Bate Papo. Suba de título para participar.</p>
        )}
      </section>

      {/* notificações de network */}
      {notifAberta ? (
        <div className="hg-zap-notif" role="dialog" aria-label="Pedidos de network">
          <header><strong>Network</strong><button type="button" className="hg-x" onClick={() => setNotifAberta(false)} aria-label="Fechar"><Icon name="x" /></button></header>
          {pedidos.length === 0 ? <p className="hg-sub">Nenhum pedido ainda. Toque numa mensagem do grupo para começar.</p> : null}
          {pedidos.map((p) => (
            <article key={p.de} className={"hg-zap-pedido is-" + p.estado}>
              <Avatar name={p.de} />
              <div>
                <strong>{p.de}</strong><span>{[p.empresa || TITULO_CHAT[p.de], p.quando].filter(Boolean).join(" · ")}</span>
                {p.estado === "enviado" ? <p>Você pediu para fazer network. Aguardando resposta…</p> : null}
                {p.estado === "recebido" ? <><p><b>{p.de.split(" ")[0]}</b> quer fazer network com você.</p><div className="hg-zap-pedido-acoes"><Button variant="cyan" onClick={() => aceitarRecebido(p.de)}>Aceitar</Button><Button variant="ghost" onClick={() => recusar(p.de)}>Recusar</Button></div></> : null}
                {p.estado === "convite" ? <><p>Network aceito. Quer entrar em um chat privado com <b>{p.de.split(" ")[0]}</b>?</p><div className="hg-zap-pedido-acoes"><Button variant="cyan" icon="msg" onClick={() => abrirPrivado(p.de)}>Sim, abrir chat</Button><Button variant="ghost" onClick={() => recusar(p.de)}>Agora não</Button></div></> : null}
                {p.estado === "aceito" ? <p>Chat privado aberto. <a href="#" onClick={(e) => { e.preventDefault(); abrirPrivado(p.de); }}>Ir para a conversa</a></p> : null}
              </div>
            </article>
          ))}
        </div>
      ) : null}
    </div>
  );
}

Object.assign(window, { ChatScreen });

})();
</script>

<script type="text/babel" data-presets="react">
/* AcademyScreen.jsx */
/* Reino Academy — trilhas fictícias do mapa mental + aulas reais, coladas por URL (YouTube/Panda Video).
   A IA lê só o que a plataforma expõe (título, descrição, thumbnail) ou uma transcrição colada;
   não há download nem transcrição automática do vídeo aqui. */
(() => {
const { PageHead, Panel, Button, Icon, Input, ProgressBar, ProgressRing, EmptyState, Pill } = window.BabelOSDesignSystem_5ad360;
const CHAVE = "reino.academy.aulas";
const lerAulas = () => { try { return JSON.parse(localStorage.getItem(CHAVE) || "[]"); } catch (e) { return []; } };
const gravarAulas = (lst) => { try { localStorage.setItem(CHAVE, JSON.stringify(lst)); } catch (e) {} };

function ehAdmin() {
  try {
    const s = (window.ReinoContas && window.ReinoContas.sessao && window.ReinoContas.sessao()) || {};
    return s.situacao === "admin" || localStorage.getItem("reino.situacao") === "admin";
  } catch (e) { return false; }
}

/* reconhece a URL e prepara o player, sem chave nenhuma */
function detectarVideo(url) {
  const u = String(url || "").trim();
  let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/i);
  if (m) return { plataforma: "youtube", id: m[1], embedUrl: "https://www.youtube.com/embed/" + m[1], thumb: "https://i.ytimg.com/vi/" + m[1] + "/hqdefault.jpg" };
  m = u.match(/pandavideo\.com\.br.*?[?&]v=([\w-]+)/i) || u.match(/pandavideo\.com\.br\/embed\/\?v=([\w-]+)/i);
  if (m) return { plataforma: "panda", id: m[1], embedUrl: u.includes("/embed/") ? u : "https://player.pandavideo.com.br/embed/?v=" + m[1], thumb: null };
  if (/pandavideo\.com\.br/i.test(u)) return { plataforma: "panda", id: null, embedUrl: u, thumb: null };
  return null;
}

/* metadados públicos do YouTube via oEmbed — sem chave */
async function metaYouTube(url) {
  try {
    const r = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(url));
    if (!r.ok) return null;
    const j = await r.json();
    return { titulo: j.title, autor: j.author_name, thumb: j.thumbnail_url };
  } catch (e) { return null; }
}

async function gerarResumo({ titulo, descricao, transcricao }) {
  const base = [titulo && "Título: " + titulo, descricao && "Descrição/metadados: " + descricao, transcricao && "Transcrição: " + transcricao.slice(0, 6000)].filter(Boolean).join("\n\n");
  if (!base.trim()) return "Sem informação suficiente para resumir — o vídeo não trouxe título nem descrição.";
  const prompt = "Você é o assistente do Reino Academy, uma trilha de formação sobre indicação, afiliados e vendas. " +
    "Com base apenas no material abaixo (sem inventar o que não está escrito), escreva em português do Brasil:\n" +
    "1) um resumo de 3 a 5 frases do que a aula ensina;\n" +
    "2) o nível de experiência recomendado para assistir (Barão, Visconde, Conde, Marquês, Duque, Príncipe, Rei ou Imperador — do mais iniciante ao mais avançado);\n" +
    "Responda só com JSON válido: {\"resumo\": \"...\", \"nivel\": \"...\"}\n\n" + base;
  const texto = await window.claude.complete(prompt);
  try {
    const j = JSON.parse(String(texto).match(/\{[\s\S]*\}/)[0]);
    return j;
  } catch (e) { return { resumo: String(texto).slice(0, 900), nivel: "Barão" }; }
}

function FormularioAula({ onCriar, ocupado, setOcupado }) {
  const [url, setUrl] = React.useState("");
  const [tituloManual, setTituloManual] = React.useState("");
  const [descManual, setDescManual] = React.useState("");
  const [transcricao, setTranscricao] = React.useState("");
  const [erro, setErro] = React.useState(null);
  const [aberto, setAberto] = React.useState(false);

  const enviar = async (e) => {
    e.preventDefault();
    setErro(null);
    const v = detectarVideo(url);
    if (!v) { setErro("Não reconheci essa URL. Cole um link do YouTube ou do Panda Video."); return; }
    setOcupado(true);
    try {
      let titulo = tituloManual.trim(), thumb = v.thumb;
      if (v.plataforma === "youtube" && !titulo) {
        const m = await metaYouTube(url);
        if (m) { titulo = m.titulo; thumb = m.thumb || thumb; }
      }
      titulo = titulo || "Aula sem título";
      const ia = await gerarResumo({ titulo, descricao: descManual, transcricao });
      onCriar({ id: "aula-" + Date.now(), titulo, plataforma: v.plataforma, embedUrl: v.embedUrl, thumb, resumo: ia.resumo || "", nivel: ia.nivel || "Barão", criadoEm: new Date().toISOString() });
      setUrl(""); setTituloManual(""); setDescManual(""); setTranscricao(""); setAberto(false);
    } catch (err) { setErro("Não foi possível analisar agora: " + (err && err.message ? err.message : "tente de novo")); }
    finally { setOcupado(false); }
  };

  if (!aberto) return <Button variant="cyan" icon="mais" onClick={() => setAberto(true)}>Adicionar aula por URL</Button>;
  return (
    <form onSubmit={enviar} style={{ display: "grid", gap: ".6rem", padding: ".9rem", borderRadius: 14, background: "rgba(255,255,255,.04)", border: "1px solid rgba(255,255,255,.1)" }}>
      <strong style={{ fontSize: ".85rem" }}>Nova aula a partir de um vídeo</strong>
      <Input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="Link do YouTube ou do Panda Video" aria-label="URL do vídeo" required />
      <Input value={tituloManual} onChange={(e) => setTituloManual(e.target.value)} placeholder="Título (opcional — no YouTube eu busco sozinho)" aria-label="Título" />
      <textarea value={descManual} onChange={(e) => setDescManual(e.target.value)} placeholder="Descrição da aula, se quiser guiar o resumo" rows={2} style={{ padding: ".5rem .65rem", borderRadius: 8, border: "1px solid rgba(255,255,255,.18)", background: "rgba(7,12,22,.4)", color: "inherit", font: "inherit", resize: "vertical" }} />
      <textarea value={transcricao} onChange={(e) => setTranscricao(e.target.value)} placeholder="Cole a transcrição aqui para um resumo mais fiel (opcional — eu não transcrevo o vídeo sozinho)" rows={3} style={{ padding: ".5rem .65rem", borderRadius: 8, border: "1px solid rgba(255,255,255,.18)", background: "rgba(7,12,22,.4)", color: "inherit", font: "inherit", resize: "vertical" }} />
      {erro ? <span style={{ fontSize: ".78rem", color: "#ff9a9a" }}>{erro}</span> : null}
      <div style={{ display: "flex", gap: ".5rem" }}>
        <Button type="submit" variant="cyan" disabled={ocupado}>{ocupado ? "Analisando com IA…" : "Analisar e adicionar"}</Button>
        <Button type="button" variant="ghost" onClick={() => setAberto(false)} disabled={ocupado}>Cancelar</Button>
      </div>
    </form>
  );
}

function AcademyScreen() {
  const d = window.BABEL_DEMO;
  const ordem = d.titulos.map((t) => t.nome).reverse();
  const meu = ordem.indexOf(d.perfil.titulo);
  const media = Math.round(d.academy.reduce((s, c) => s + c.progresso, 0) / d.academy.length);
  const admin = ehAdmin();
  const [aulas, setAulas] = React.useState(lerAulas);
  const [ocupado, setOcupado] = React.useState(false);
  const [tocando, setTocando] = React.useState(null);

  const criarAula = (aula) => setAulas((lst) => { const novo = [aula, ...lst]; gravarAulas(novo); return novo; });
  const apagarAula = (id) => setAulas((lst) => { const novo = lst.filter((a) => a.id !== id); gravarAulas(novo); return novo; });

  return (
    <>
      <PageHead title="Reino Academy" subtitle="Trilhas curtas para render mais no Reino. Cada título libera novos cursos." />
      <div className="hg-ops hg-encher hg-duas-col" style={{ "--col1": "minmax(0,1fr)" }}>
        <Panel fill title="Trilhas" subtitle={(d.academy.length + aulas.length) + " cursos"}>
          <div className="hg-rolar" style={{ display: "grid", gap: "1rem" }}>
            {admin ? <FormularioAula onCriar={criarAula} ocupado={ocupado} setOcupado={setOcupado} /> : null}

            {aulas.length ? (
              <ul className="hg-cursos">
                {aulas.map((a) => (
                  <li key={a.id}>
                    <span className="hg-cursos-ico">{a.thumb ? <img src={a.thumb} alt="" style={{ width: 40, height: 40, objectFit: "cover", borderRadius: 8 }} /> : <Icon name="revista" />}</span>
                    <div>
                      <strong>{a.titulo}</strong>
                      <span>{a.plataforma === "youtube" ? "YouTube" : "Panda Video"} · nível sugerido: {a.nivel}</span>
                      {a.resumo ? <p style={{ fontSize: ".78rem", opacity: .75, margin: ".25rem 0 0" }}>{a.resumo}</p> : null}
                    </div>
                    <div style={{ display: "flex", gap: ".4rem" }}>
                      <Button variant="cyan" onClick={() => setTocando(a)}>Assistir</Button>
                      {admin ? <Button variant="ghost" onClick={() => apagarAula(a.id)}>Remover</Button> : null}
                    </div>
                  </li>
                ))}
              </ul>
            ) : null}

            <ul className="hg-cursos">
              {d.academy.map((c) => {
                const liberado = ordem.indexOf(c.nivel) <= meu;
                return (
                  <li key={c.nome} className={liberado ? "" : "is-bloqueado"}>
                    <span className="hg-cursos-ico"><Icon name={liberado ? "revista" : "coroa"} /></span>
                    <div>
                      <strong>{c.nome}</strong>
                      <span>{c.aulas} aulas · {c.duracao}{liberado ? "" : " · exige " + c.nivel}</span>
                      {liberado ? <ProgressBar value={c.progresso} /> : null}
                    </div>
                    {liberado ? (
                      <Button variant={c.progresso ? "ghost" : "cyan"}>{c.progresso === 100 ? "Revisar" : c.progresso ? "Continuar" : "Começar"}</Button>
                    ) : <span className="hg-sub">Bloqueado</span>}
                  </li>
                );
              })}
            </ul>
          </div>
        </Panel>
        <Panel tone="conquistas" fill title="Seu progresso" headingLevel={3}>
          <ProgressRing value={media} label="das trilhas liberadas" />
          <p className="hg-sub" style={{ textAlign: "center" }}>Concluir uma trilha conta pontos para a sua guilda.</p>
        </Panel>
      </div>

      {tocando ? (
        <div role="dialog" aria-modal="true" onClick={() => setTocando(null)} style={{ position: "fixed", inset: 0, background: "rgba(4,8,16,.82)", display: "grid", placeItems: "center", zIndex: 60, padding: "1rem" }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: "min(880px, 100%)", background: "#0b1220", borderRadius: 16, border: "1px solid rgba(255,255,255,.12)", overflow: "hidden" }}>
            <div style={{ position: "relative", paddingTop: "56.25%", background: "#000" }}>
              <iframe src={tocando.embedUrl} title={tocando.titulo} allow="autoplay; fullscreen; picture-in-picture" allowFullScreen style={{ position: "absolute", inset: 0, width: "100%", height: "100%", border: 0 }} />
            </div>
            <div style={{ padding: "1rem 1.1rem" }}>
              <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: "1rem" }}>
                <strong style={{ fontSize: "1rem" }}>{tocando.titulo}</strong>
                <Button variant="ghost" onClick={() => setTocando(null)}>Fechar</Button>
              </div>
              <p style={{ fontSize: ".85rem", opacity: .8, marginTop: ".4rem" }}>{tocando.resumo}</p>
              <span style={{ fontSize: ".75rem", opacity: .6 }}>Nível sugerido pela IA: {tocando.nivel}</span>
            </div>
          </div>
        </div>
      ) : null}
    </>
  );
}

Object.assign(window, { AcademyScreen });
})();
</script>

<script type="text/babel" data-presets="react">
/* PreCadastroScreen.jsx */
(() => {
const { Panel, Button, Select, Field, Toolbar, Pill, TitleChip, AffiliateLink, Icon } = window.BabelOSDesignSystem_5ad360;

/* Tela pública: cabeçalho próprio (sem menu lateral) e o mapa do Brasil. */
function PreCadastroScreen({ ir }) {
  const d = window.BABEL_DEMO;
  const [titulo, setTitulo] = React.useState("Duque");
  React.useEffect(() => { localStorage.setItem("reino.tituloEscolhido", titulo); }, [titulo]);
  const escolhido = d.titulos.find((t) => t.nome === titulo);
  return (
    <>

}

Object.assign(window, { PreCadastroScreen });

<script type="text/babel" data-presets="react">
/* LoginScreen.jsx */
(() => {
const { Icon } = window.BabelOSDesignSystem_5ad360;

/* Tela de entrada: o globo imersivo do produto ao fundo e um cartão de vidro
   azul-claro na frente. Qualquer usuário e senha entram (demonstração). */
function LoginScreen({ onEntrar }) {
  const [aba, setAba] = React.useState("entrar");
  const [f, setF] = React.useState({ usuario: "", senha: "", nome: "", email: "", afiliado: "" });
  const [mostraAfiliado, setMostraAfiliado] = React.useState(false);
  // código de quem indicou: ?ref= na URL ou colado no campo
  const refUrl = React.useMemo(() => (window.ReinoAfiliados ? window.ReinoAfiliados.codigoDaUrl() : "") || sessionStorage.getItem("reino.ref") || new URLSearchParams(location.search).get("ref") || "", []);
  const codigoRef = (v) => { const s = String(v || ""); const m = s.match(/[?&]ref=([^&#\s]+)/) || s.match(/\/r\/([A-Za-z0-9_-]+)/); return (m ? decodeURIComponent(m[1]) : s.trim()).toLowerCase(); };
  const codigo = codigoRef(f.afiliado) || refUrl;
  // link de administrador: ?adm=reino-adm-2026 → a conta nasce liberada como admin
  const adm = React.useMemo(() => new URLSearchParams(location.search).get("adm") === "reino-adm-2026", []);
  React.useEffect(() => { if (adm) setAba("cadastro"); }, [adm]);
  const colar = async () => { try { const t = await navigator.clipboard.readText(); if (t) setF((v) => ({ ...v, afiliado: t })); } catch (e) { /* sem permissão: o usuário cola manualmente */ } };
  const [erro, setErro] = React.useState("");
  const [indo, setIndo] = React.useState(false);
  const campo = (k) => (e) => { setF((v) => ({ ...v, [k]: e.target.value })); setErro(""); };
  const enviar = async (e) => {
    e.preventDefault();
    const ok = aba === "entrar" ? f.usuario.trim() && f.senha : f.nome.trim() && f.email.trim() && f.senha;
    if (!ok) { setErro("Preencha os campos para continuar."); return; }
    setIndo(true);
    // valida no banco quando há conta configurada; sem banco, segue em demonstração
    const C = window.ReinoContas;
    if (C) {
      try {
        if (aba === "entrar") await C.entrar(f.usuario.trim(), f.senha);
        else await C.cadastrar({ nome: f.nome.trim(), email: f.email.trim(), senha: f.senha, titulo: localStorage.getItem("reino.tituloEscolhido") || undefined, indicadoPor: codigoRef(f.afiliado) || refUrl || undefined, situacao: adm ? "admin" : undefined });
      } catch (err) {
        // demonstração: qualquer usuário e senha entram. O banco só é usado quando confere.
        if (aba === "entrar") { try { C.entrarLocal(f.usuario.trim()); } catch (e) {} }
        else { setIndo(false); setErro(err.message); return; }
      }
    }
    if (codigo) { localStorage.setItem("reino.indicadoPor", codigo); sessionStorage.setItem("reino.ref", codigo); }
    // cadastro novo: registra o indicado (cidade/UF/título vêm do perfil de demonstração até o pré-cadastro real)
    if (aba === "cadastro" && window.ReinoAfiliados) {
      const perfil = window.BABEL_DEMO && window.BABEL_DEMO.perfil;
      // cidade e UF vêm da localização real de quem se cadastra (afiliados.js → geo)
      window.ReinoAfiliados.registrarCadastro({ nome: f.nome.trim(), email: f.email.trim(), titulo: localStorage.getItem("reino.tituloEscolhido") || (perfil && perfil.titulo) });
    }
    // conta nova entra como pré-cadastro; quem já tem conta entra liberado
    try { localStorage.setItem("reino.situacao", adm ? "admin" : aba === "cadastro" ? "aguardando" : "membro"); } catch (e) {}
    if (aba === "cadastro" && window.ReinoFotos) {
      const provisoria = window.ReinoFotos.obter("novo-cadastro");
      if (provisoria && f.nome.trim()) { window.ReinoFotos.definir(f.nome.trim(), provisoria); window.ReinoFotos.remover("novo-cadastro"); }
    }
    setTimeout(() => onEntrar({ nome: aba === "entrar" ? f.usuario.trim() : f.nome.trim(), indicadoPor: codigo || null }), 650);
  };
  return (
    <div className={"hg-login" + (indo ? " is-indo" : "")}>
      <div className="hg-login-globo" aria-hidden="true"><Globo imersivo /></div>
      <div className="hg-login-veu" aria-hidden="true" />
      <form className="hg-login-cartao" onSubmit={enviar} noValidate>
        <div className="hg-login-marca"><span className="hg-brand-coroa"><Icon name="coroa" /></span><span>Rei<b>no</b></span></div>
        <div className="hg-login-abas" role="tablist">
          <button type="button" role="tab" aria-selected={aba === "entrar"} onClick={() => setAba("entrar")}>Entrar</button>
          <button type="button" role="tab" aria-selected={aba === "cadastro"} onClick={() => setAba("cadastro")}>Criar conta</button>
        </div>
        {aba === "entrar" ? (
          <>
            <label className="hg-login-campo"><span>Usuário ou e-mail</span><input value={f.usuario} onChange={campo("usuario")} autoComplete="username" autoFocus /></label>
            <label className="hg-login-campo"><span>Senha</span><input type="password" value={f.senha} onChange={campo("senha")} autoComplete="current-password" /></label>
          </>
        ) : (
          <>
            <div className="hg-login-foto">
              <FotoAvatar chave={f.nome.trim() || "novo-cadastro"} nome={f.nome.trim() || "?"} size={72} editavel camera />
              <div><b>Sua foto</b><span>Toque para usar a câmera ou escolher da galeria. Ela aparece no mapa, no feed e na rede.</span></div>
            </div>
            <label className="hg-login-campo"><span>Nome</span><input value={f.nome} onChange={campo("nome")} autoComplete="name" autoFocus /></label>
            <label className="hg-login-campo"><span>E-mail</span><input type="email" value={f.email} onChange={campo("email")} autoComplete="email" /></label>
            <label className="hg-login-campo"><span>Senha</span><input type="password" value={f.senha} onChange={campo("senha")} autoComplete="new-password" /></label>
          </>
        )}
        <div className="hg-login-afiliado">
          {mostraAfiliado || f.afiliado ? (
            <>
              <label className="hg-login-campo"><span>Link de afiliado</span>
                <div className="hg-login-afiliado-linha">
                  <input value={f.afiliado} onChange={campo("afiliado")} placeholder={(window.REINO_DOMINIO || location.origin) + "/r/…"} autoComplete="off" />
                  <button type="button" className="hg-login-colar" onClick={colar}>Colar</button>
                </div>
              </label>
              {codigo ? <p className="hg-login-afiliado-ok">Indicado por <b>{codigo}</b> — a comissão vai para quem te convidou.</p> : null}
            </>
          ) : (
            <button type="button" onClick={() => setMostraAfiliado(true)}><Icon name="link" />{refUrl ? "Indicado por " + refUrl + " · alterar" : "Tenho um link de afiliado"}</button>
          )}
        </div>
        {erro ? <p className="hg-login-erro" role="alert">{erro}</p> : null}
        <button type="submit" className="hg-login-btn" disabled={indo}>{indo ? "Entrando…" : aba === "entrar" ? "Entrar no Reino" : "Criar minha conta"}</button>
        <p className="hg-login-nota">{aba === "entrar" ? "Demonstração: qualquer usuário e senha entram." : "Ao continuar você escolhe seu título e território."}</p>
      </form>
    </div>
  );
}

Object.assign(window, { LoginScreen });

})();
</script>
<script type="text/babel" data-presets="react">
/* App.jsx */
const { Sidebar, TopBar, TabBar, Drawer, ListRow, DemoBadge, Panel, PageHead, EmptyState } = window.BabelOSDesignSystem_5ad360;

const TELAS = {
  "index.html": DashboardScreen,
  "guildas.html": GuildasScreen,
  "rede-social.html": RedeSocialScreen,
  "conquistas.html": ConquistasScreen,
  "bolsa.html": BolsaScreen,
  "mapa.html": MapaScreen,
  "match.html": MatchScreen,
  "revista.html": RevistaScreen,
  "vitrine.html": VitrineScreen,
  "hierarquia.html": HierarquiaScreen,
  "pesquisa.html": PesquisaScreen,
  "configuracoes.html": ConfiguracoesScreen,
  "perfil.html": PerfilScreen,
  "clube.html": ClubeScreen,
  "rede-completa.html": RedeCompletaScreen,
  "meus-acessos.html": AcessosScreen,
  "admin.html": AdminScreen,
  "chat.html": ChatScreen,
  "niveis.html": NiveisScreen,
  "academy.html": AcademyScreen,
  "eventos.html": EventosScreen,
};
const PAGINA = { "index.html": "inicio", "bolsa.html": "bolsa" };
const USUARIO = { ...(window.BABEL_DEMO ? window.BABEL_DEMO.perfil : {}), uf: "SP", cidade: "Campinas", bairro: "Cambuí" };

function EmBreve({ titulo }) {
  return (
    <>
      <PageHead title={titulo} subtitle="Módulo existente no produto, fora do escopo deste kit." />
      <Panel fill>
        <EmptyState icon="camadas" title={titulo}
          description="Esta tela existe no produto (app/*.html) mas não foi recriada neste UI kit." />
      </Panel>
    </>
  );
}

function App() {
  const d = window.BABEL_DEMO;
  const [logado, setLogado] = React.useState(() => sessionStorage.getItem("reino.logado") === "1");
  const [rota, setRota] = React.useState("index.html");
  const [menu, setMenu] = React.useState(false);
  const [gaveta, setGaveta] = React.useState(null);
  const [recolhido, setRecolhido] = React.useState(() => localStorage.getItem("reino.menu") === "recolhido");
  const [modo, setModo] = React.useState(() => localStorage.getItem("reino.modo") || "pc");
  // o item "Minha conta" é inserido aqui para não depender da versão compilada do menu
  const MENU = React.useMemo(() => {
    const base = window.BabelOSDesignSystem_5ad360.MENU_BABEL;
    const novo = base.slice();
    const por = (h) => novo.findIndex(([x]) => x === h);
    const antes = (item) => { const i = por("configuracoes.html"); novo.splice(i < 0 ? novo.length : i, 0, item); };
    if (por("perfil.html") < 0) antes(["perfil.html", "tecnicos", "Minha conta"]);
    if (por("admin.html") < 0) antes(["admin.html", "clientes", "Contas no banco"]);
    return novo;
  }, []);
  React.useEffect(() => { localStorage.setItem("reino.menu", recolhido ? "recolhido" : "aberto"); }, [recolhido]);
  React.useEffect(() => {
    localStorage.setItem("reino.modo", modo);
    document.documentElement.classList.toggle("is-modo-app", modo === "app");
    window.dispatchEvent(new Event("resize"));
  }, [modo]);
  const Modo = (
    <div className="hg-modo" role="group" aria-label="Modo de exibição">
      <button type="button" aria-pressed={modo === "pc"} onClick={() => setModo("pc")}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>PC
      </button>
      <button type="button" aria-pressed={modo === "app"} onClick={() => setModo("app")}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5" /><path d="M11 18h2" /></svg>App
      </button>
    </div>
  );
  const ir = (href) => { setRota(href); setMenu(false); };

  /* conta de administrador: reina como Imperador, com o selo destacado e pulsante */
  const ehAdm = React.useMemo(() => {
    try {
      const s = (window.ReinoContas && window.ReinoContas.sessao && window.ReinoContas.sessao()) || {};
      return s.situacao === "admin" || localStorage.getItem("reino.situacao") === "admin";
    } catch (e) { return false; }
  }, []);
  const tituloAtual = ehAdm ? "Imperador" : d.perfil.titulo;
  const SeloImperador = ehAdm ? (
    <span className="hg-selo-imperador" title="Conta de administrador">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.2 3L12 4l4.8 7L21 8l-1.6 10H4.6L3 8Z" /></svg>Imperador
    </span>
  ) : null;

  React.useEffect(() => {
    // o cartão do usuário é um link; aqui ele vira navegação interna
    const clique = (e) => { const a = e.target.closest && e.target.closest(".hg-user"); if (a) { e.preventDefault(); ir("perfil.html"); } };
    document.addEventListener("click", clique, true);
    return () => document.removeEventListener("click", clique, true);
  }, []);
  React.useEffect(() => {
    document.body.dataset.page = PAGINA[rota] || rota.replace(".html", "");
    document.body.classList.toggle("is-imersivo", rota === "mapa.html");
  }, [rota]);

  if (!logado) return (
    <div className="hg-moldura hg-moldura-login">
      <LoginScreen onEntrar={() => { sessionStorage.setItem("reino.logado", "1"); setLogado(true); }} />
      <div className="hg-modo hg-modo-login" role="group" aria-label="Modo de exibição">
        <button type="button" aria-pressed={modo === "pc"} onClick={() => setModo("pc")}>PC</button>
        <button type="button" aria-pressed={modo === "app"} onClick={() => setModo("app")}>App</button>
      </div>
    </div>
  );
  if (rota === "pre-cadastro.html") return <PreCadastroScreen ir={ir} />;

  const Tela = TELAS[rota];
  const titulo = (MENU.find(([h]) => h === rota) || [, , rota])[2];

  return (
    <div className="hg-moldura">
      <div className={"hg-app" + (menu ? " is-menu" : "") + (recolhido ? " is-recolhido" : "")}>
        <Sidebar current={rota} items={MENU} onNavigate={ir} collapsed={recolhido} />
        <button type="button" className="hg-side-seta" onClick={() => setRecolhido((v) => !v)} aria-label={recolhido ? "Expandir menu" : "Recolher menu"} aria-expanded={!recolhido}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>
        </button>
        <div className="hg-main">
          <TopBar user={d.perfil.nome} role={tituloAtual + " · " + d.perfil.cidade} notifications messages
            onMenu={() => setMenu((v) => !v)} onNotifications={() => setGaveta("notificacoes")} onMessages={() => ir("chat.html")}
            actions={<>{SeloImperador}{Modo}<DemoBadge inline href="#">Dados fictícios</DemoBadge></>} />
          <main className="hg-content">
            {Tela ? <Tela ir={ir} usuario={USUARIO} /> : <EmBreve titulo={titulo} />}
          </main>
        </div>
      </div>
      <TabBar current={rota} onNavigate={ir} />
      <Drawer open={gaveta === "notificacoes"} title="Notificações" onClose={() => setGaveta(null)}>
        <ul className="hg-list">{d.notificacoes.map((n) => <ListRow key={n.titulo} title={n.titulo} subtitle={n.texto} time={n.quando} avatar={n.autor} />)}</ul>
      </Drawer>
    </div>
  );
}

Object.assign(window, { App });
</script>
<script type="text/babel" data-presets="react">
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
