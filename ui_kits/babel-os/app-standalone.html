<script type="text/babel" data-presets="react">
/* NetworkMapLocal.jsx */
(() => {
const { Icon } = window.BabelOSDesignSystem_5ad360;
/* Cópia local de components/reino/NetworkMap.jsx (com a prop positions) — o bundle
   compilado é atualizado ao fim do turno; o kit não pode depender disso. */

const iniciais = (nome) => String(nome || "").trim().split(/\s+/).filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join("");

/* Rede ao vivo: empresas como nós sobre o mapa, ligadas por raios de luz.
   x/y são porcentagens do painel, então a rede acompanha qualquer tamanho. */
function NetworkMapLocal({ nodes = [], links = [], selected, onSelect, footer, height, overlay, positions }) {
  /* positions: { [id]: {x, y} } em px (ancorado ao mapa) — quando ausente usa x/y em % dos nós */
  const pos = (n) => (positions ? positions[n.id] : { x: n.x, y: n.y });
  const un = positions ? "px" : "%";
  const visiveis = nodes.filter((n) => pos(n));
  const porId = Object.fromEntries(visiveis.map((n) => [n.id, n]));
  const atual = nodes.find((n) => n.id === selected);
  return (
    <div className={"hg-rede-mapa" + (overlay ? " is-overlay" : "") + (positions ? " is-ancorada" : "")} style={height ? { height } : undefined}>
      <svg className="hg-rede-raios" viewBox={positions ? undefined : "0 0 100 100"} preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="hg-raio-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stopColor="#3fe3ff" /><stop offset="1" stopColor="#8b5cff" />
          </linearGradient>
        </defs>
        {links.map(([a, b], i) => {
          const na = porId[a], nb = porId[b];
          if (!na || !nb) return null;
          const aceso = selected && (a === selected || b === selected);
          const cls = aceso ? " is-aceso" : "";
          const pa = pos(na), pb = pos(nb);
          const pos2 = { x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y };
          return (
            <g key={i} style={{ "--atraso": (i * 0.55) + "s" }}>
              <line {...pos2} className={"hg-raio-halo" + cls} />
              <line {...pos2} className={"hg-raio" + cls} />
              <line {...pos2} className={"hg-raio-pulso" + cls} />
            </g>
          );
        })}
      </svg>
      {visiveis.map((n) => <i key={"p" + n.id} className="hg-rede-ponto" style={{ left: pos(n).x + un, top: pos(n).y + un }} aria-hidden="true" />)}
      {visiveis.map((n) => (
        <button key={n.id} className={"hg-rede-no" + (n.id === selected ? " is-ativo" : "")}
          style={{ left: pos(n).x + un, top: pos(n).y + un }} onClick={() => onSelect && onSelect(n.id)}
          aria-label={n.nome + (n.nicho ? " · " + n.nicho : "")} aria-pressed={n.id === selected}>
          <span className="hg-rede-pino">
            {n.foto ? <img src={n.foto} alt="" /> : <b>{iniciais(n.nome)}</b>}
          </span>
          <span className="hg-rede-rotulo">{n.nome}</span>
        </button>
      ))}
      {atual ? (
        <aside className="hg-rede-cartao">
          <p className="hg-globo-sobre">{atual.nicho || "Empresa do Reino"}</p>
          <strong>{atual.nome}</strong>
          {atual.cidade ? <span><Icon name="pin" />{atual.cidade}</span> : null}
          {atual.estado ? <span className="hg-rede-estado">{atual.estado}</span> : null}
        </aside>
      ) : null}
      {footer ? <div className="hg-rede-dock">{footer}</div> : null}
    </div>
  );
}

Object.assign(window, { NetworkMapLocal });

})();
</script>

let carregando = null;
function carregarMapLibre() {
  if (window.maplibregl) return Promise.resolve(window.maplibregl);
  if (carregando) return carregando;
  carregando = new Promise((ok, falha) => {
    if (!document.querySelector("link[data-maplibre]")) {
      const l = document.createElement("link"); l.rel = "stylesheet"; l.href = MAPLIBRE_CSS; l.dataset.maplibre = "1"; document.head.appendChild(l);
    }
    const s = document.createElement("script");
    s.src = MAPLIBRE_JS; s.onload = () => ok(window.maplibregl); s.onerror = () => falha(new Error("Não foi possível carregar o desenhista do mapa."));
    document.head.appendChild(s);
  });
  return carregando;
}

let idxCidades = null;
function cidadesIndex() {
  if (idxCidades) return idxCidades;
  idxCidades = new Map();
  try { (window.BabelDemo("reino/mapa", {}).cidades || []).forEach((c) => idxCidades.set(norm(c.nome) + "|" + c.uf, c)); } catch (e) {}
  return idxCidades;
}
const acharCidade = (nome, uf) => {
  const i = cidadesIndex();
  if (uf) { const d = i.get(norm(nome) + "|" + String(uf).toUpperCase()); if (d) return d; }
  for (const [k, v] of i) if (k.startsWith(norm(nome) + "|")) return v;
  return null;
};
const fc = (feats) => ({ type: "FeatureCollection", features: feats });
const ponto = (c, props) => ({ type: "Feature", geometry: { type: "Point", coordinates: [c.lng, c.lat] }, properties: props });
const espalhar = (c, i) => ({ lng: c.lng + Math.cos(i * 2.4) * 0.012 * (1 + (i % 3)), lat: c.lat + Math.sin(i * 2.4) * 0.012 * (1 + (i % 3)) });

function camadaEmpresas(uf) {
  try {
    const m = window.BabelDemo("reino/mapa", uf ? { estado: uf } : {});
    return fc((m.cidades || []).filter((c) => c.empresas > 0).map((c) => ponto(c, { camada: "empresas", nome: c.nome, sub: c.uf + " · " + c.empresas + " empresa(s)", peso: c.empresas })));
  } catch (e) { return fc([]); }
}
function camadaRede() {
  const nos = (window.BABEL_DEMO && window.BABEL_DEMO.rede && window.BABEL_DEMO.rede.nos) || [];
  return fc(nos.map((n, i) => {
    const c = acharCidade(n.cidade, n.estado); if (!c) return null;
    return ponto(espalhar(c, i), { camada: "rede", nome: n.nome, sub: (n.nicho || "") + " · " + n.cidade + "/" + (n.estado || ""), peso: 3 });
  }).filter(Boolean));
}
function camadaEventos() {
  const evs = (window.BABEL_DEMO && window.BABEL_DEMO.eventos) || [];
  return fc(evs.map((e, i) => {
    const [cid, ufe] = String(e.local || "").split("·").map((s) => s.trim());
    const c = acharCidade(cid, ufe); if (!c) return null;
    return ponto(espalhar(c, i + 7), { camada: "eventos", nome: e.nome, sub: e.data + " · " + e.local + " · " + (e.vagas || ""), peso: 4 });
  }).filter(Boolean));
}
async function camadasBanco() {
  const cfg = window.REINO_SUPABASE;
  if (!cfg || !cfg.url || !cfg.anon) return { cliques: fc([]), cadastros: fc([]) };
  const base = cfg.url.replace(/\/$/, "") + "/rest/v1/";
  const cab = { apikey: cfg.anon, Authorization: "Bearer " + cfg.anon };
  const pega = (q) => fetch(base + q, { headers: cab }).then((r) => (r.ok ? r.json() : [])).catch(() => []);
  const [cl, cd] = await Promise.all([
    pega("cliques?select=codigo,cidade,uf,cadastrou,criado_em&order=criado_em.desc&limit=500"),
    pega("cadastros?select=nome,titulo,cidade,uf,codigo,criado_em&order=criado_em.desc&limit=500"),
  ]);
  const monta = (linhas, camada, texto) => fc((linhas || []).map((l, i) => {
    const c = acharCidade(l.cidade, l.uf); if (!c) return null;
    return ponto(espalhar(c, i + 13), { camada, nome: texto(l), sub: (l.cidade || "") + (l.uf ? "/" + l.uf : "") + " · " + new Date(l.criado_em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }), peso: 2 });
  }).filter(Boolean));
  return {
    cliques: monta(cl, "cliques", (l) => "Clique em " + (l.codigo || "direto")),
    cadastros: monta(cd, "cadastros", (l) => (l.nome || "Cadastro") + (l.titulo ? " · " + l.titulo : "")),
  };
}
function camadaTerritorios(uf) {
  const emb = uf && window.REINO_MUNICIPIOS && window.REINO_MUNICIPIOS[uf];
  if (!emb) return fc([]);
  return fc(emb.cidades.map((m, i) => {
    const aneis = (m.g || []).map((plano) => { const anel = []; for (let k = 0; k < plano.length; k += 2) anel.push([plano[k], plano[k + 1]]); if (anel.length > 2) anel.push(anel[0]); return anel; }).filter((a) => a.length > 3);
    if (!aneis.length) return null;
    const t = i % TITULOS.length;
    return { type: "Feature", geometry: { type: "Polygon", coordinates: aneis }, properties: { camada: "territorios", nome: m.nome, sub: "Território de " + TITULOS[t], cor: CORTITULO[t], titulo: TITULOS[t] } };
  }).filter(Boolean));
}
function empresasDaCidade(nome, uf) {
  try {
    const lst = window.BabelDemo("reino/empresas", { cidade: nome, estado: uf, limite: 60 });
    return (Array.isArray(lst) ? lst : lst && lst.itens ? lst.itens : []).slice(0, 60);
  } catch (e) { return []; }
}

/* ---- Google Places: empresas de verdade no raio do mapa ---- */
const CAMPOS = ["places.id", "places.displayName", "places.primaryTypeDisplayName", "places.formattedAddress", "places.location",
  "places.rating", "places.userRatingCount", "places.nationalPhoneNumber", "places.websiteUri",
  "places.currentOpeningHours.openNow", "places.currentOpeningHours.weekdayDescriptions", "places.priceLevel", "places.photos"].join(",");
const PRECO = { PRICE_LEVEL_FREE: "grátis", PRICE_LEVEL_INEXPENSIVE: "$", PRICE_LEVEL_MODERATE: "$$", PRICE_LEVEL_EXPENSIVE: "$$$", PRICE_LEVEL_VERY_EXPENSIVE: "$$$$" };
/* o Google responde em inglês e com o número do projeto; aqui vira uma frase curta */
function emPortugues(err) {
  const m = String((err && err.message) || ""), s = (err && err.status) || "";
  const det = JSON.stringify((err && err.details) || []);
  if (/SERVICE_DISABLED/.test(det) || /has not been used in project|is disabled|not activated|SERVICE_DISABLED/i.test(m))
    return "Falta ativar a Places API (New) no seu projeto do Google Cloud.";
  if (/API key not valid|referer|API_KEY/i.test(m)) return "O Google recusou a chave. Verifique as restrições de site e de API.";
  if (s === "PERMISSION_DENIED") return "O Google negou o acesso. Confira se a Places API está ativada e com faturamento.";
  if (/billing/i.test(m)) return "Falta ativar o faturamento no projeto do Google Cloud.";
  if (s === "RESOURCE_EXHAUSTED" || /quota/i.test(m)) return "A cota do Google terminou por hoje.";
  if (s === "INVALID_ARGUMENT") return "A busca não foi aceita pelo Google.";
  return "Não foi possível consultar o Google agora.";
}

async function buscarGoogle({ lat, lng, raio = 1200, texto = "" }) {
  const k = GOOGLE(); if (!k) throw new Error("Sem chave do Google configurada.");
  const url = "https://places.googleapis.com/v1/places:" + (texto ? "searchText" : "searchNearby");
  const corpo = texto
    ? { textQuery: texto, languageCode: "pt-BR", maxResultCount: 20, locationBias: { circle: { center: { latitude: lat, longitude: lng }, radius: raio } } }
    : { languageCode: "pt-BR", maxResultCount: 20, rankPreference: "POPULARITY", locationRestriction: { circle: { center: { latitude: lat, longitude: lng }, radius: Math.min(raio, 50000) } } };
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Goog-Api-Key": k, "X-Goog-FieldMask": CAMPOS }, body: JSON.stringify(corpo) });
  const j = await r.json();
  if (j.error) throw new Error(emPortugues(j.error));
  return (j.places || []).map((p) => ({
    id: p.id, nome: (p.displayName && p.displayName.text) || "sem nome",
    categoria: (p.primaryTypeDisplayName && p.primaryTypeDisplayName.text) || "",
    endereco: p.formattedAddress || "", lat: p.location && p.location.latitude, lng: p.location && p.location.longitude,
    nota: p.rating, avaliacoes: p.userRatingCount, telefone: p.nationalPhoneNumber || "", site: p.websiteUri || "",
    aberto: p.currentOpeningHours ? p.currentOpeningHours.openNow : undefined,
    horarios: (p.currentOpeningHours && p.currentOpeningHours.weekdayDescriptions) || null,
    preco: PRECO[p.priceLevel] || "", foto: p.photos && p.photos[0] ? p.photos[0].name : null,
  }));
}
const fotoUrl = (nome, h = 160) => "https://places.googleapis.com/v1/" + nome + "/media?maxHeightPx=" + h + "&key=" + GOOGLE();

function dentro(pt, poli) {
  let d = false;
  for (let i = 0, j = poli.length - 1; i < poli.length; j = i++) {
    const [xi, yi] = poli[i], [xj, yj] = poli[j];
    if (yi > pt[1] !== yj > pt[1] && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) d = !d;
  }
  return d;
}

function ReinoMapa({ uf, cidade, bairro, onVoltar }) {
  const caixa = React.useRef(null);
  const mapa = React.useRef(null);
  const [pronto, setPronto] = React.useState(false);
  const [falha, setFalha] = React.useState(null);
  const [ligadas, setLigadas] = React.useState({ empresas: true, rede: true, cliques: true, cadastros: true, eventos: true, google: true, territorios: false, calor: false });
  const [sel, setSel] = React.useState(null);
  const [busca, setBusca] = React.useState("");
  const [achados, setAchados] = React.useState(null);
  const [modo, setModo] = React.useState(null);
  const [rota, setRota] = React.useState([]);
  const [area, setArea] = React.useState([]);
  const [dentroArea, setDentroArea] = React.useState(null);
  const [cartoes, setCartoes] = React.useState(null);
  const [lendoGoogle, setLendoGoogle] = React.useState(false);
  const [avisoGoogle, setAvisoGoogle] = React.useState(null);
  const dadosRef = React.useRef({});
  const ultBusca = React.useRef("");

  React.useEffect(() => {
    let morto = false;
    carregarMapLibre().then((ml) => {
      if (morto || !caixa.current) return;
      /* estado: enquadra pelo conjunto dos municípios, não por um deles */
      const caixaEstado = (() => {
        if (!uf) return null;
        let x1 = 180, y1 = 90, x2 = -180, y2 = -90, n = 0;
        for (const [k, c] of cidadesIndex()) {
          if (!k.endsWith("|" + String(uf).toUpperCase())) continue;
          n++; if (c.lng < x1) x1 = c.lng; if (c.lng > x2) x2 = c.lng; if (c.lat < y1) y1 = c.lat; if (c.lat > y2) y2 = c.lat;
        }
        return n > 1 ? [[x1, y1], [x2, y2]] : null;
      })();
      const centro = (() => {
        if (cidade) { const c = acharCidade(cidade, uf); if (c) return [c.lng, c.lat]; }
        if (caixaEstado) return [(caixaEstado[0][0] + caixaEstado[1][0]) / 2, (caixaEstado[0][1] + caixaEstado[1][1]) / 2];
        return [-47.9, -15.8];
      })();
      const m = new ml.Map({ container: caixa.current, style: estiloReino(), center: centro,
        zoom: bairro ? 15.4 : cidade ? 11.6 : uf ? 6.4 : 4.1, minZoom: 3, maxZoom: 19, attributionControl: false });
      m.addControl(new ml.NavigationControl({ showCompass: false }), "bottom-right");
      m.addControl(new ml.AttributionControl({ compact: true, customAttribution: "Cartografia do Reino" }), "bottom-left");
      m.on("error", () => {});
      const aoPronto = () => { if (!morto && !mapa.current) { mapa.current = m; setPronto(true); } };
      m.on("load", () => { if (caixaEstado && !cidade && !bairro) m.fitBounds(caixaEstado, { padding: 48, duration: 0 }); aoPronto(); });
      m.on("idle", aoPronto);
      setTimeout(aoPronto, 6000);
    }).catch((e) => setFalha(e.message));
    return () => { morto = true; if (mapa.current) { mapa.current.remove(); mapa.current = null; } };
  }, []);

  React.useEffect(() => {
    if (!pronto) return;
    const m = mapa.current;
    const dados = { empresas: camadaEmpresas(uf), rede: camadaRede(), eventos: camadaEventos(), territorios: camadaTerritorios(uf), cliques: fc([]), cadastros: fc([]), google: fc([]) };
    dadosRef.current = dados;
    if (!m.getSource("territorios")) {
      m.addSource("territorios", { type: "geojson", data: dados.territorios });
      m.addLayer({ id: "territorios-fill", type: "fill", source: "territorios", paint: { "fill-color": ["get", "cor"], "fill-opacity": 0.16 } });
      m.addLayer({ id: "territorios-linha", type: "line", source: "territorios", paint: { "line-color": ["get", "cor"], "line-width": 0.8, "line-opacity": 0.55 } });
    }
    ["empresas", "rede", "cliques", "cadastros", "eventos", "google"].forEach((c) => {
      if (m.getSource(c)) return;
      m.addSource(c, { type: "geojson", data: dados[c], cluster: true, clusterRadius: 44, clusterMaxZoom: 12 });
      m.addLayer({ id: c + "-cluster", type: "circle", source: c, filter: ["has", "point_count"],
        paint: { "circle-color": COR[c], "circle-opacity": 0.28, "circle-stroke-color": COR[c], "circle-stroke-width": 1.4,
          "circle-radius": ["interpolate", ["linear"], ["get", "point_count"], 2, 13, 40, 24, 400, 38] } });
      m.addLayer({ id: c + "-num", type: "symbol", source: c, filter: ["has", "point_count"],
        layout: { "text-field": ["to-string", ["get", "point_count"]], "text-size": 11, "text-font": ["Noto Sans Bold"] }, paint: { "text-color": "#fff" } });
      m.addLayer({ id: c + "-pt", type: "circle", source: c, filter: ["!", ["has", "point_count"]],
        paint: { "circle-color": COR[c], "circle-radius": ["interpolate", ["linear"], ["coalesce", ["get", "peso"], 2], 1, 4.5, 20, 11], "circle-stroke-color": "rgba(0,0,0,.55)", "circle-stroke-width": 1 } });
    });
    if (!m.getSource("calor")) {
      m.addSource("calor", { type: "geojson", data: fc([]) });
      m.addLayer({ id: "calor-camada", type: "heatmap", source: "calor",
        paint: { "heatmap-weight": ["interpolate", ["linear"], ["coalesce", ["get", "peso"], 1], 0, 0.15, 20, 1], "heatmap-intensity": 0.9, "heatmap-radius": 34, "heatmap-opacity": 0.7 } }, "territorios-fill");
      m.addSource("rota", { type: "geojson", data: fc([]) });
      m.addLayer({ id: "rota-linha", type: "line", source: "rota", paint: { "line-color": "#63f2a5", "line-width": 4, "line-opacity": 0.9 } });
      m.addSource("area", { type: "geojson", data: fc([]) });
      m.addLayer({ id: "area-fill", type: "fill", source: "area", paint: { "fill-color": "#5ad8ff", "fill-opacity": 0.14 } });
      m.addLayer({ id: "area-linha", type: "line", source: "area", paint: { "line-color": "#5ad8ff", "line-width": 2, "line-dasharray": [2, 1.5] } });
    }
    camadasBanco().then((b) => {
      if (!mapa.current) return;
      dadosRef.current = { ...dadosRef.current, ...b };
      ["cliques", "cadastros"].forEach((c) => m.getSource(c) && m.getSource(c).setData(b[c]));
      atualizarCalor();
    });
    atualizarCalor();
  }, [pronto, uf, cidade]);

  const atualizarCalor = React.useCallback(() => {
    const m = mapa.current; if (!m || !m.getSource("calor")) return;
    const d = dadosRef.current;
    m.getSource("calor").setData(fc(["empresas", "rede", "cliques", "cadastros", "eventos", "google"].flatMap((c) => (d[c] ? d[c].features : []))));
  }, []);

  /* Google Places: no nível de bairro, automático */
  const chamarGoogle = React.useCallback(async (texto) => {
    const m = mapa.current; if (!m) return;
    const c = m.getCenter(), z = m.getZoom();
    const raio = Math.max(400, Math.min(20000, 40000 / Math.pow(1.7, z - 11)));
    setLendoGoogle(true); setAvisoGoogle(null);
    try {
      const lst = await buscarGoogle({ lat: c.lat, lng: c.lng, raio, texto });
      if (!mapa.current) return;
      const feats = lst.filter((p) => p.lat != null).map((p) => ({ type: "Feature", geometry: { type: "Point", coordinates: [p.lng, p.lat] },
        properties: { camada: "google", nome: p.nome, sub: [p.categoria, p.endereco].filter(Boolean).join(" · "), peso: 3, dados: JSON.stringify(p) } }));
      dadosRef.current = { ...dadosRef.current, google: fc(feats) };
      m.getSource("google") && m.getSource("google").setData(fc(feats));
      atualizarCalor();
      setCartoes({ titulo: texto || "Empresas por aqui", origem: "google", lista: lst });
      if (!lst.length) setAvisoGoogle("Nada encontrado neste raio.");
    } catch (e) { setAvisoGoogle(e.message); setCartoes(null); }
    finally { setLendoGoogle(false); }
  }, [atualizarCalor]);

  React.useEffect(() => {
    if (!pronto || !bairro || !GOOGLE()) return;
    const chave = uf + "|" + cidade + "|" + bairro;
    if (ultBusca.current === chave) return;
    ultBusca.current = chave;
    chamarGoogle("");
  }, [pronto, bairro, cidade, uf, chamarGoogle]);

  React.useEffect(() => {
    const m = mapa.current; if (!pronto || !m) return;
    const ver = (id, v) => m.getLayer(id) && m.setLayoutProperty(id, "visibility", v ? "visible" : "none");
    ["empresas", "rede", "cliques", "cadastros", "eventos", "google"].forEach((c) => { ver(c + "-cluster", ligadas[c]); ver(c + "-num", ligadas[c]); ver(c + "-pt", ligadas[c]); });
    ver("territorios-fill", ligadas.territorios); ver("territorios-linha", ligadas.territorios); ver("calor-camada", ligadas.calor);
  }, [ligadas, pronto]);

  React.useEffect(() => {
    const m = mapa.current; if (!pronto || !m) return;
    const clique = (e) => {
      if (modo === "rota") { setRota((r) => (r.length >= 2 ? [[e.lngLat.lng, e.lngLat.lat]] : [...r, [e.lngLat.lng, e.lngLat.lat]])); return; }
      if (modo === "area") { setArea((a) => [...a, [e.lngLat.lng, e.lngLat.lat]]); return; }
      const camadas = ["google-pt", "empresas-pt", "rede-pt", "cliques-pt", "cadastros-pt", "eventos-pt", "territorios-fill"].filter((c) => m.getLayer(c));
      const f = m.queryRenderedFeatures(e.point, { layers: camadas })[0];
      if (f) {
        setSel({ ...f.properties });
        if (f.properties.camada === "google" && f.properties.dados) {
          try { setCartoes({ titulo: f.properties.nome, origem: "google", lista: [JSON.parse(f.properties.dados)] }); } catch (err) {}
        } else if (f.properties.camada === "empresas" && f.properties.nome) {
          const u = String(f.properties.sub || "").split(" · ")[0];
          setCartoes({ titulo: f.properties.nome + (u ? " · " + u : ""), origem: "reino", lista: empresasDaCidade(f.properties.nome, u) });
        } else setCartoes(null);
      } else {
        const cl = m.queryRenderedFeatures(e.point, { layers: camadas.map((c) => c.replace("-pt", "-cluster")).filter((c) => m.getLayer(c)) })[0];
        if (cl) m.easeTo({ center: cl.geometry.coordinates, zoom: Math.min(m.getZoom() + 2.2, 16) });
        else { setSel(null); setCartoes(null); }
      }
    };
    m.on("click", clique);
    return () => m.off("click", clique);
  }, [pronto, modo]);

  /* rota pelo OSRM — livre, sem chave */
  React.useEffect(() => {
    const m = mapa.current; if (!pronto || !m || !m.getSource("rota")) return;
    if (rota.length < 2) { m.getSource("rota").setData(fc(rota.length ? [{ type: "Feature", geometry: { type: "Point", coordinates: rota[0] }, properties: {} }] : [])); return; }
    const p = rota.map(([lng, lat]) => lng.toFixed(5) + "," + lat.toFixed(5)).join(";");
    fetch("https://router.project-osrm.org/route/v1/driving/" + p + "?overview=full&geometries=geojson")
      .then((r) => r.json())
      .then((j) => {
        const rt = j && j.routes && j.routes[0]; if (!rt || !mapa.current) return;
        m.getSource("rota").setData(fc([{ type: "Feature", geometry: rt.geometry, properties: {} }]));
        setSel({ nome: "Rota traçada", sub: (rt.distance / 1000).toFixed(1) + " km · " + Math.round(rt.duration / 60) + " min", camada: "rota" });
      }).catch(() => setSel({ nome: "Rota", sub: "Não foi possível calcular agora.", camada: "rota" }));
  }, [rota, pronto]);

  React.useEffect(() => {
    const m = mapa.current; if (!pronto || !m || !m.getSource("area")) return;
    if (area.length < 3) { m.getSource("area").setData(fc([])); setDentroArea(null); return; }
    const anel = [...area, area[0]];
    m.getSource("area").setData(fc([{ type: "Feature", geometry: { type: "Polygon", coordinates: [anel] }, properties: {} }]));
    const d = dadosRef.current, conta = {};
    ["empresas", "rede", "cliques", "cadastros", "eventos", "google"].forEach((c) => { conta[c] = (d[c] ? d[c].features : []).filter((f) => dentro(f.geometry.coordinates, anel)).length; });
    setDentroArea(conta);
  }, [area, pronto]);

  /* busca de endereço pelo Nominatim do OpenStreetMap — sem chave, como o resto do mapa */
  const buscar = async (e) => {
    e.preventDefault();
    const t = busca.trim(); if (!t) return;
    setAchados([]);
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&countrycodes=br&accept-language=pt-BR&limit=6&q=" + encodeURIComponent(t), { headers: { Accept: "application/json" } });
      const j = await r.json();
      setAchados((Array.isArray(j) ? j : []).map((x) => ({ nome: x.display_name.split(",").slice(0, 3).join(","), sub: x.display_name, pos: [parseFloat(x.lon), parseFloat(x.lat)] })));
    } catch (err) { setAchados([]); }
  };
  const irPara = (a) => { setAchados(null); setBusca(a.nome); mapa.current && mapa.current.easeTo({ center: a.pos, zoom: 15 }); };

  const chip = (k, cor) => (
    <button key={k} type="button" onClick={() => setLigadas((v) => ({ ...v, [k]: !v[k] }))}
      style={{ display: "inline-flex", alignItems: "center", gap: ".35rem", padding: ".28rem .6rem", borderRadius: 999, fontSize: ".74rem", cursor: "pointer",
        whiteSpace: "nowrap", lineHeight: 1.1,
        border: "1px solid " + (ligadas[k] ? cor : "rgba(255,255,255,.16)"), background: ligadas[k] ? "rgba(255,255,255,.1)" : "transparent",
        color: ligadas[k] ? "#eaf3ff" : "rgba(234,243,255,.55)" }}>
      <span style={{ width: 8, height: 8, borderRadius: 99, background: cor, opacity: ligadas[k] ? 1 : .4 }} />{CURTO[k] || ROTULO[k]}
    </button>
  );
  const botao = (ativo, ao, texto) => (
    <button type="button" onClick={ao} style={{ padding: ".3rem .65rem", borderRadius: 8, fontSize: ".74rem", cursor: "pointer", whiteSpace: "nowrap", lineHeight: 1.1,
      border: "1px solid " + (ativo ? "#c79a3c" : "rgba(255,255,255,.18)"), background: ativo ? "rgba(199,154,60,.2)" : "rgba(8,14,26,.6)", color: "#eaf3ff" }}>{texto}</button>
  );

  /* a barra do mapa desce para baixo do cabeçalho do app, quando existe um */
  const [topoLivre, setTopoLivre] = React.useState(".7rem");
  React.useEffect(() => {
    const medir = () => {
      const cx = caixa.current; if (!cx) return;
      const cab = document.querySelector(".hg-topbar, header.hg-top, .hg-top");
      if (!cab) return setTopoLivre(".7rem");
      const rc = cx.getBoundingClientRect(), rb = cab.getBoundingClientRect();
      const sobra = rb.bottom - rc.top;
      setTopoLivre(sobra > 4 ? Math.round(sobra + 10) + "px" : ".7rem");
    };
    medir();
    window.addEventListener("resize", medir);
    return () => window.removeEventListener("resize", medir);
  }, [pronto]);

  if (falha) return <EmptyState icon="alerta" title="Mapa indisponível" description={falha} />;

  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden" }}>
      <div ref={caixa} style={{ position: "absolute", inset: 0 }} />

      <div style={{ position: "absolute", top: topoLivre, left: ".7rem", right: ".7rem", display: "flex", flexWrap: "wrap", gap: ".45rem", alignItems: "flex-start", pointerEvents: "none" }}>
        <div style={{ display: "flex", gap: ".45rem", flexWrap: "wrap", pointerEvents: "auto" }}>
          {onVoltar ? botao(false, onVoltar, "← Globo") : null}
          {botao(false, () => chamarGoogle(""), lendoGoogle ? "Buscando…" : "Buscar empresas aqui")}
        </div>
        <form onSubmit={buscar} style={{ display: "flex", gap: ".3rem", pointerEvents: "auto", flex: "1 1 200px", maxWidth: 340, position: "relative" }}>
          <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Endereço, cidade ou o que procura" aria-label="Buscar no mapa"
            style={{ flex: 1, minWidth: 0, padding: ".35rem .6rem", borderRadius: 8, border: "1px solid rgba(255,255,255,.18)", background: "rgba(7,12,22,.85)", color: "#eaf3ff", fontSize: ".78rem" }} />
          {botao(false, () => chamarGoogle(busca.trim()), "Empresas")}
          {achados ? (
            <ul style={{ position: "absolute", top: "100%", left: 0, right: 0, marginTop: ".25rem", listStyle: "none", padding: ".25rem", borderRadius: 10, background: "rgba(7,12,22,.97)", border: "1px solid rgba(255,255,255,.14)", maxHeight: 210, overflowY: "auto" }}>
              {!achados.length ? <li style={{ padding: ".4rem .5rem", fontSize: ".76rem", opacity: .6 }}>Nada encontrado.</li> : achados.map((a, i) => (
                <li key={i}><button type="button" onClick={() => irPara(a)} style={{ display: "block", width: "100%", textAlign: "left", padding: ".35rem .5rem", borderRadius: 7, border: 0, background: "transparent", color: "#eaf3ff", fontSize: ".76rem", cursor: "pointer" }}>{a.nome}</button></li>
              ))}
            </ul>
          ) : null}
        </form>
      </div>

      {avisoGoogle && !achados ? (
        <div style={{ position: "absolute", top: "calc(" + topoLivre + " + 2.5rem)", left: ".7rem", padding: ".4rem .65rem", borderRadius: 9, background: "rgba(7,12,22,.94)", border: "1px solid rgba(255,179,92,.4)", color: "#ffd9a8", fontSize: ".75rem", maxWidth: 300 }}>{avisoGoogle}</div>
      ) : null}

      <div style={{ position: "absolute", bottom: "3.1rem", left: ".7rem", display: "flex", flexDirection: "column", gap: ".4rem", alignItems: "flex-start", maxWidth: "min(430px, calc(100% - 1.4rem))" }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: ".3rem" }}>
          {["google", "empresas", "rede", "cliques", "cadastros", "eventos"].map((k) => chip(k, COR[k]))}
          {chip("territorios", "#ffd97a")}{chip("calor", "#ff7ba9")}
        </div>
        <div style={{ display: "flex", gap: ".35rem", flexWrap: "wrap" }}>
          {botao(modo === "rota", () => { setModo(modo === "rota" ? null : "rota"); setRota([]); }, modo === "rota" ? "Rota: toque 2 pontos" : "Traçar rota")}
          {botao(modo === "area", () => { setModo(modo === "area" ? null : "area"); setArea([]); }, modo === "area" ? "Área: toque os cantos" : "Desenhar área")}
          {rota.length || area.length ? botao(false, () => { setRota([]); setArea([]); setDentroArea(null); setModo(null); }, "Limpar") : null}
        </div>
      </div>

      {dentroArea ? (
        <div style={{ position: "absolute", top: "calc(" + topoLivre + " + 2.7rem)", right: cartoes ? "calc(min(340px, 100% - 1.4rem) + 1.1rem)" : ".7rem", padding: ".6rem .75rem", borderRadius: 12, background: "rgba(7,12,22,.94)", border: "1px solid rgba(90,216,255,.35)", fontSize: ".78rem", color: "#eaf3ff", minWidth: 190 }}>
          <strong style={{ display: "block", marginBottom: ".3rem" }}>Dentro da área</strong>
          {Object.entries(dentroArea).map(([k, v]) => <div key={k} style={{ display: "flex", justifyContent: "space-between", gap: "1rem", opacity: v ? 1 : .5 }}><span>{ROTULO[k]}</span><b>{v}</b></div>)}
        </div>
      ) : null}

      {cartoes ? (
        <div style={{ position: "absolute", top: "calc(" + topoLivre + " + 2.7rem)", right: ".7rem", bottom: "7.4rem", width: "min(340px, calc(100% - 1.4rem))", display: "flex", flexDirection: "column", borderRadius: 14, background: "rgba(7,12,22,.95)", border: "1px solid rgba(199,154,60,.35)", overflow: "hidden" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: ".5rem", padding: ".65rem .8rem", borderBottom: "1px solid rgba(255,255,255,.1)" }}>
            <div>
              <span style={{ display: "block", fontSize: ".64rem", textTransform: "uppercase", letterSpacing: ".08em", color: cartoes.origem === "google" ? COR.google : COR.empresas }}>{cartoes.origem === "google" ? "Google Maps" : "Empresas do Reino"}</span>
              <strong style={{ fontSize: ".92rem", color: "#eaf3ff" }}>{cartoes.titulo}</strong>
              <span style={{ display: "block", fontSize: ".7rem", color: "rgba(234,243,255,.5)" }}>{cartoes.lista.length} resultado(s)</span>
            </div>
            <button type="button" onClick={() => setCartoes(null)} aria-label="Fechar" style={{ border: 0, background: "transparent", color: "rgba(234,243,255,.6)", cursor: "pointer", fontSize: ".9rem" }}>✕</button>

<script type="text/babel" data-presets="react">
/* MapaPanel.jsx */
(() => {
const { Panel } = window.BabelOSDesignSystem_5ad360;
const NetworkMap = window.NetworkMapLocal;

/* Globo real do produto: monta window.BabelGlobo (globo.js) com os mesmos opts
   de app/js/app.js:341 e responde com os dados de demonstração (window.BabelDemo).
   Terra → Lua (torre Babel) → Brasil → estado → cidade → bairro.
   Ao chegar no bairro, a rede de empresas (raios de luz) aparece sobre o mapa. */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n, d = 0) => (n == null ? "—" : Number(n).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }));
const estrelas = (n) => {
  const cheias = Math.round(Number(n) || 0);
  return '<span class="hg-stars">' + Array.from({ length: 5 }, (_, i) => (i < cheias ? "★" : "<i>★</i>")).join("") + "</span>";
};
const iniciais = (nome) => String(nome || "").trim().split(/\s+/).filter(Boolean).slice(0, 2).map((s) => s[0].toUpperCase()).join("");
const buscar = async (recurso, params) => ({ estado: "ok", dados: window.BabelDemo(recurso, params || {}) });

function Globo({ imersivo, usuario }) {
  const ref = React.useRef(null);
  const apiRef = React.useRef(null);
  const [nivel, setNivel] = React.useState("terra");
  const [lugar, setLugar] = React.useState({ uf: "", cidade: "", bairro: "" });
  const [semMapa, setSemMapa] = React.useState(false);
  const [foco, setFoco] = React.useState(null);
  const [host, setHost] = React.useState(null);
  const [posicoes, setPosicoes] = React.useState(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el || !window.BabelGlobo) return;
    const api = window.BabelGlobo.criar(el, { buscar, esc, num, estrelas, iniciais, clima: null, empresasGoogle: null, imersivo: !!imersivo });
    apiRef.current = api;
    if (usuario) api.definirUsuario(usuario);
    /* "Ver no mapa" (Rede Completa etc.) deixa um destino pendente: o globo voa até ele ao montar */
    const destino = window.__destinoMapa;
    if (destino) { window.__destinoMapa = null; setTimeout(() => api.irEndereco(destino), 600); }
    /* A cada quadro desenhado, reprojeta as empresas: elas ficam presas ao mapa ao arrastar/zoom. */
    const rede = window.BABEL_DEMO.rede;
    let ultimo = "";
    const reprojetar = () => {
      const b = api.bairroAtual && api.bairroAtual();
      if (!b || b.lat == null) { if (ultimo !== "") { ultimo = ""; setPosicoes(null); } return; }
      const out = {};
      rede.nos.forEach((n) => {
        const p = api.projetar(b.lng + (n.dLng || 0), b.lat + (n.dLat || 0));
        if (p) out[n.id] = { x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 };
      });
      const chave = JSON.stringify(out);
      if (chave !== ultimo) { ultimo = chave; setPosicoes(out); }
    };
    el.addEventListener("globo:quadro", reprojetar);
    /* A rede é montada dentro da raiz do globo (mesma área do canvas), por portal. */
    const ov = document.createElement("div");
    ov.className = "hg-rede-host";
    el.appendChild(ov);
    setHost(ov);
    /* globo.js grava o nível atual em data-nivel a cada mudança */
    const obs = new MutationObserver(() => {
      const n = el.dataset.nivel || "terra";
      setNivel((v) => (v === n ? v : n));
      const u = el.dataset.uf || "", c = el.dataset.cidade || "", b = el.dataset.bairro || "";
      setLugar((v) => (v.uf === u && v.cidade === c && v.bairro === b ? v : { uf: u, cidade: c, bairro: b }));
    });
    obs.observe(el, { attributes: true, attributeFilter: ["data-nivel", "data-uf", "data-cidade", "data-bairro"] });
    return () => { el.removeEventListener("globo:quadro", reprojetar); api.destruir && api.destruir(); obs.disconnect(); setHost(null); el.innerHTML = ""; el.className = ""; };
  }, [imersivo]);
  const rede = window.BABEL_DEMO.rede;
  /* do Brasil para baixo a cartografia do Reino assume: em qualquer nível dá para descer até a rua */
  /* uma vez dentro do Brasil o mapa fica montado — o globo mexe em data-nivel durante a
     animação e remontar a cada passagem zerava a carga do mapa */
  const [entrou, setEntrou] = React.useState(false);
  React.useEffect(() => { if (nivel !== "terra" && nivel !== "lua") setEntrou(true); }, [nivel]);
  const noMapa = !semMapa && entrou && !!window.ReinoMapa;
  const voltarAoGlobo = () => { setSemMapa(true); setEntrou(false); const api = apiRef.current; api && api.irTerra(); };
  return (
    <>
      <div ref={ref} className="hg-encher" style={noMapa ? { visibility: "hidden" } : undefined} />
      {noMapa ? <window.ReinoMapa uf={lugar.uf} cidade={lugar.cidade} bairro={lugar.bairro} onVoltar={voltarAoGlobo} /> : null}
      {host && nivel === "bairro" && posicoes ? ReactDOM.createPortal(
        <NetworkMap overlay nodes={rede.nos} links={rede.raios} selected={foco} onSelect={setFoco} positions={posicoes} />, host) : null}
    </>
  );
}

function MapaPanel({ title = "Mapa Reino", subtitle = "Gire o planeta, entre no Brasil e desça até o bairro para ver a rede de empresas", usuario, onClose }) {
  return (
    <Panel className="hg-map-panel hg-globo-panel" fill title={title} subtitle={subtitle} onClose={onClose}>
      <Globo usuario={usuario} />
    </Panel>
  );
}

Object.assign(window, { Globo, MapaPanel });
})();
</script>

<script type="text/babel" data-presets="react">
/* FotoAvatar.jsx */
(() => {
const { Avatar, Icon } = window.BabelOSDesignSystem_5ad360;

/* FotoAvatar — avatar com foto real quando existe; iniciais quando não.
   Com `editavel`, aceita arrastar a imagem em cima ou tocar para escolher
   (galeria/câmera). A foto fica guardada por chave (nome ou id). */
function FotoAvatar({ chave, nome, size = 44, gradient, editavel, className = "", camera }) {
  const F = window.ReinoFotos;
  const k = chave || nome;
  const [url, setUrl] = React.useState(() => (F ? F.obter(k) : null));
  const [sobre, setSobre] = React.useState(false);
  React.useEffect(() => { if (!F) return; setUrl(F.obter(k)); return F.ouvir(() => setUrl(F.obter(k))); }, [k]);
  const escolher = async (e) => { e.preventDefault(); e.stopPropagation(); if (!editavel || !F) return; await F.escolher(k, { camera }); };
  const soltar = async (e) => {
    e.preventDefault(); e.stopPropagation(); setSobre(false);
    if (!editavel || !F) return;
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) await F.definirArquivo(k, f);
  };
  const est = { width: size, height: size };
  if (!url) {
    return (
      <span className={"hg-foto" + (editavel ? " is-editavel" : "") + (sobre ? " is-sobre" : "") + (className ? " " + className : "")} style={est}
            onClick={editavel ? escolher : undefined} onDragOver={editavel ? (e) => { e.preventDefault(); setSobre(true); } : undefined}
            onDragLeave={editavel ? () => setSobre(false) : undefined} onDrop={editavel ? soltar : undefined}
            title={editavel ? "Toque ou arraste uma foto" : undefined} role={editavel ? "button" : undefined}>
        <Avatar name={nome} gradient={gradient} size={size} />
        {editavel ? <i className="hg-foto-mais" aria-hidden="true"><Icon name="mais" /></i> : null}
      </span>
    );
  }
  return (
    <span className={"hg-foto has-foto" + (editavel ? " is-editavel" : "") + (sobre ? " is-sobre" : "") + (className ? " " + className : "")} style={est}
          onClick={editavel ? escolher : undefined} onDragOver={editavel ? (e) => { e.preventDefault(); setSobre(true); } : undefined}
          onDragLeave={editavel ? () => setSobre(false) : undefined} onDrop={editavel ? soltar : undefined}
          title={editavel ? "Trocar foto" : nome} role={editavel ? "button" : undefined}>
      <img src={url} alt={nome || ""} />
      {editavel ? <i className="hg-foto-mais" aria-hidden="true"><Icon name="mais" /></i> : null}
    </span>
  );
}

Object.assign(window, { FotoAvatar });

})();
</script>
<script type="text/babel" data-presets="react">
/* Stories.jsx */
const { Avatar, Icon, Button } = window.BabelOSDesignSystem_5ad360;

/* Stories do Reino — faixa de círculos, visualizador em tela cheia e criador.
   Sem fotos no produto: cada story é um fundo (gradiente/filtro) com texto e
   empresa marcada. Curtir, responder, repostar (com a empresa já marcada) e apagar. */
const FUNDOS = [
  { id: "aurora", nome: "Aurora", css: "linear-gradient(160deg,#0b2a6b,#3fe3ff)" },
  { id: "neon", nome: "Neon", css: "linear-gradient(160deg,#3b82ff,#e04bff)" },
  { id: "ouro", nome: "Ouro", css: "linear-gradient(160deg,#5a3a00,#f5c76a)" },

];
const FILTROS = [
  { id: "nenhum", nome: "Original", css: "none" },
  { id: "vivido", nome: "Vívido", css: "saturate(1.6) contrast(1.1)" },
  { id: "frio", nome: "Frio", css: "hue-rotate(25deg) saturate(1.2)" },
  { id: "quente", nome: "Quente", css: "sepia(.35) saturate(1.4)" },
  { id: "pb", nome: "P&B", css: "grayscale(1) contrast(1.15)" },
  { id: "sonho", nome: "Sonho", css: "blur(.6px) brightness(1.1) saturate(1.3)" },
  { id: "retro", nome: "Retrô", css: "sepia(.6) contrast(.9) brightness(.95)" },
];
const hora = () => new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const STORIES_INICIAIS = [
  { autor: "Ana Ribeiro", itens: [
    { id: "s1", fundo: "aurora", filtro: "nenhum", texto: "Diagnóstico grátis esta semana. Chama no privado!", tx: 50, ty: 42, empresa: "Pulso Marketing Digital", quando: "2 h", curtidas: 31, visto: false },
    { id: "s2", fundo: "noite", filtro: "vivido", texto: "Guilda Paulista bateu 3.840 pontos 🏆", tx: 50, ty: 60, empresa: "Guilda Paulista", quando: "1 h", curtidas: 54, visto: false } ] },
  { autor: "Camila Duarte", itens: [
    { id: "s3", fundo: "neon", filtro: "frio", texto: "Procuro contabilidade parceira em Curitiba", tx: 50, ty: 50, empresa: "Pinheiro Tech Solutions", quando: "4 h", curtidas: 12, visto: false } ] },
  { autor: "Eduarda Lopes", itens: [
    { id: "s4", fundo: "floresta", filtro: "nenhum", texto: "Unidade Boa Vista inaugurada!", tx: 50, ty: 38, empresa: "Capibaribe Clínica", quando: "6 h", curtidas: 47, visto: true } ] },
  { autor: "Henrique Alves", itens: [
    { id: "s5", fundo: "ouro", filtro: "quente", texto: "3 vagas na Guilda Planalto", tx: 50, ty: 55, empresa: "Planalto Consultoria", quando: "9 h", curtidas: 9, visto: true } ] },
];

/* ---------- Faixa de círculos ---------- */
function StoriesBar({ stories, eu, onAbrir, onCriar }) {
  const meus = stories.find((s) => s.autor === eu);
  return (
    <div className="hg-stories" role="list" aria-label="Stories">
      <button type="button" className={"hg-story-circ is-eu" + (meus && meus.itens.length ? " is-novo" : "")} role="listitem" onClick={() => (meus && meus.itens.length ? onAbrir(eu) : onCriar())}>
        <span className="hg-story-anel"><Avatar name={eu} /><i className="hg-story-mais" onClick={(e) => { e.stopPropagation(); onCriar(); }} aria-hidden="true"><Icon name="mais" /></i></span>
        <span>{meus && meus.itens.length ? "Seu story" : "Criar"}</span>

      {stories.filter((s) => s.autor !== eu && s.itens.length).map((s) => (

          <span className="hg-story-anel"><Avatar name={s.autor} /></span>
          <span>{s.autor.split(" ")[0]}</span>
        </button>
      ))}
    </div>
  );
}

/* ---------- Visualizador ---------- */
function StoryViewer({ stories, autor, eu, onFechar, onCurtir, onResponder, onRepostar, onApagar, onVisto, onTrocarAutor }) {
  const grupo = stories.find((s) => s.autor === autor);
  const [i, setI] = React.useState(() => { const g = stories.find((s) => s.autor === autor); const k = g && window.__storyInicial ? g.itens.findIndex((it) => it.id === window.__storyInicial) : -1; window.__storyInicial = null; return k > 0 ? k : 0; });
  const [pausado, setPausado] = React.useState(false);
  const [resposta, setResposta] = React.useState("");
  const [enviado, setEnviado] = React.useState(false);
  const [menu, setMenu] = React.useState(false);
  const DUR = 5000;
  const item = grupo && grupo.itens[i];
  const autores = stories.filter((s) => s.itens.length).map((s) => s.autor);
  const ai = autores.indexOf(autor);
  const proximo = React.useCallback(() => {
    if (!grupo) return onFechar();
    if (i + 1 < grupo.itens.length) setI(i + 1);
    else if (ai + 1 < autores.length) { onTrocarAutor(autores[ai + 1]); setI(0); }
    else onFechar();
  }, [i, grupo, ai, autores, onFechar, onTrocarAutor]);
  const anterior = () => { if (i > 0) setI(i - 1); else if (ai > 0) { onTrocarAutor(autores[ai - 1]); setI(0); } };
  React.useEffect(() => { if (item) onVisto(item.id); }, [item && item.id]);
  React.useEffect(() => {
    if (pausado || menu || resposta) return;
    const t = setTimeout(proximo, DUR);
    return () => clearTimeout(t);
  }, [i, autor, pausado, menu, resposta, proximo]);
  React.useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onFechar(); if (e.key === "ArrowRight") proximo(); if (e.key === "ArrowLeft") anterior(); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  });
  if (!grupo || !item) return null;
  const fundo = FUNDOS.find((f) => f.id === item.fundo) || FUNDOS[0];
  const filtro = FILTROS.find((f) => f.id === item.filtro) || FILTROS[0];
  const meu = autor === eu;
  const responder = (e) => { e.preventDefault(); if (!resposta.trim()) return; onResponder(item, resposta.trim()); setResposta(""); setEnviado(true); setTimeout(() => setEnviado(false), 1600); };
  return (
    <div className="hg-story-view" role="dialog" aria-label={"Story de " + autor} onPointerDown={() => setPausado(true)} onPointerUp={() => setPausado(false)} onPointerCancel={() => setPausado(false)}>
      <div className="hg-story-caixa">
      <div className="hg-story-tela" style={{ background: fundo.css, filter: filtro.css }} key={item.id}>
        {item.midia ? (item.midia.tipo === "video" ? <video className="hg-story-midia" src={item.midia.src} autoPlay loop muted playsInline style={{ objectFit: item.midia.ajuste || "contain" }} /> : <img className="hg-story-midia" src={item.midia.src} alt="" style={{ objectFit: item.midia.ajuste || "contain" }} />) : null}
        <div className="hg-story-brilho" aria-hidden="true" />
      </div>
      <p className="hg-story-texto" style={{ left: item.tx + "%", top: item.ty + "%", fontSize: item.tamanho || "1.6rem" }}>{item.texto}</p>
      {item.empresa ? <button type="button" className="hg-story-tag" onClick={(e) => e.stopPropagation()}><Icon name="camadas" />{item.empresa}</button> : null}
      {item.repost ? <span className="hg-story-repost"><Icon name="rota" />{"repost de " + item.repost}</span> : null}
      <div className="hg-story-barras" aria-hidden="true">
        {grupo.itens.map((it, k) => <span key={it.id} className={k < i ? "is-feito" : k === i ? "is-atual" : ""} style={k === i ? { animationDuration: DUR + "ms", animationPlayState: pausado || menu || resposta ? "paused" : "running" } : undefined}><i /></span>)}
      </div>
      <header className="hg-story-cab">
        <Avatar name={autor} size={34} />
        <div><strong>{autor}</strong><span>{item.quando}{item.empresa ? " · " + item.empresa : ""}</span></div>
        {meu ? <button type="button" className="hg-story-ico" onClick={(e) => { e.stopPropagation(); setMenu((v) => !v); }} aria-label="Opções" aria-expanded={menu}><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" /></svg></button> : null}
        <button type="button" className="hg-story-ico" onClick={onFechar} aria-label="Fechar"><Icon name="x" /></button>
      </header>
      {menu ? (
        <div className="hg-story-menu" onPointerDown={(e) => e.stopPropagation()}>
          <button type="button" onClick={() => { onApagar(item.id); setMenu(false); if (grupo.itens.length <= 1) onFechar(); else setI(Math.max(0, i - 1)); }}><Icon name="x" />Apagar story</button>
          <span className="hg-sub">{item.curtidas} curtidas</span>
        </div>

/* ---------- Estado dos stories (hook) ---------- */
const VALIDADE_MS = 24 * 60 * 60 * 1000;
const expirado = (it) => it.criado_em && Date.now() - it.criado_em > VALIDADE_MS;
/* tira quem passou de 24h e some os grupos que ficaram vazios — sem isso o armazenamento só cresce */
const podarVelhos = (grupos) => grupos.map((g) => ({ ...g, itens: g.itens.filter((it) => !expirado(it)) })).filter((g) => g.itens.length);

function useStories(eu) {
  const [stories, setStories] = React.useState(() => {
    try { const s = JSON.parse(sessionStorage.getItem("reino.stories") || "null"); if (s) return podarVelhos(s); } catch (e) {}
    return STORIES_INICIAIS.map((g) => ({ ...g, itens: g.itens.map((it) => ({ ...it, criado_em: it.criado_em || Date.now() })) }));
  });
  React.useEffect(() => { try {
    const leve = stories.map((g) => ({ ...g, itens: g.itens.filter((it) => !(it.midia && it.midia.temporario)) }));
    sessionStorage.setItem("reino.stories", JSON.stringify(leve));
  } catch (e) { /* fotos grandes podem estourar a cota da sessão: segue sem persistir */ } }, [stories]);
  /* apaga de verdade, sozinho, 24h depois de publicado — checa a cada minuto */
  React.useEffect(() => {
    const t = setInterval(() => setStories((s) => { const p = podarVelhos(s); return p.length === s.length && p.every((g, i) => g.itens.length === s[i].itens.length) ? s : p; }), 60000);
    return () => clearInterval(t);
  }, []);
  const [aberto, setAberto] = React.useState(null);
  const [criando, setCriando] = React.useState(null); // null | {} | {inicial}
  const mapItem = (id, fn) => setStories((s) => s.map((g) => ({ ...g, itens: g.itens.map((it) => (it.id === id ? fn(it) : it)) })));
  const api = {
    stories, aberto, criando,
    abrir: setAberto, fechar: () => setAberto(null),
    criar: () => setCriando({}), cancelar: () => setCriando(null),
    visto: (id) => mapItem(id, (it) => (it.visto ? it : { ...it, visto: true })),
    curtir: (id) => mapItem(id, (it) => ({ ...it, curtido: !it.curtido, curtidas: it.curtidas + (it.curtido ? -1 : 1) })),
    responder: (item, texto) => { window.__respostasStories = [...(window.__respostasStories || []), { para: item.id, texto }]; },
    repostar: (item, autor) => { setAberto(null); setCriando({ inicial: { ...item, texto: item.texto, empresa: item.empresa || autor, repost: autor } }); },
    apagar: (id) => setStories((s) => s.map((g) => ({ ...g, itens: g.itens.filter((it) => it.id !== id) }))),
    publicar: (item) => { item.criado_em = Date.now(); window.__storyInicial = item.id; setStories((s) => { const tem = s.some((g) => g.autor === eu); const n = tem ? s.map((g) => (g.autor === eu ? { ...g, itens: [...g.itens, item] } : g)) : [{ autor: eu, itens: [item] }, ...s]; return n; }); setCriando(null); setAberto(eu); },
  };
  return api;
}

Object.assign(window, { StoriesBar, StoryViewer, StoryComposer, useStories, STORY_FUNDOS: FUNDOS, STORY_FILTROS: FILTROS });

   até lá, as versões locais abaixo são idênticas às de components/reino/. */
const arrobaRS = (nome) => "@" + String(nome || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "");
const numRS = (n) => (n >= 1000 ? (n / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : String(n ?? 0));

function PostRS({ autor, empresa, titulo, quando, texto, curtidas = 0, comentarios = 0, repostagens = 0, onAbrir }) {
  const [liked, setLiked] = React.useState(false);
  const [likes, setLikes] = React.useState(curtidas);
  const [rep, setRep] = React.useState(false);
  const stop = (fn) => (e) => { e.stopPropagation(); fn && fn(); };
  return (
    <article className={"hg-tweet" + (onAbrir ? " is-clicavel" : "")} onClick={onAbrir}>
      <FotoAvatar nome={autor} />
      <div className="hg-tweet-corpo">
        <header className="hg-tweet-cab">
          <strong>{autor}</strong>
          {titulo ? <span className="hg-tweet-selo" title={"Título: " + titulo}><Icon name="coroa" /></span> : null}
          <span className="hg-tweet-meta">{arrobaRS(autor)}{empresa ? " · " + empresa : ""}{quando ? " · " + quando : ""}</span>
        </header>
        {titulo ? <span className="hg-tweet-titulo">{titulo}</span> : null}
        <p className="hg-tweet-texto">{texto}</p>
        <footer className="hg-tweet-acoes">
          <button type="button" onClick={stop()} aria-label="Responder"><Icon name="msg" /><span>{numRS(comentarios)}</span></button>
          <button type="button" className={rep ? "is-on is-verde" : ""} onClick={stop(() => setRep((v) => !v))} aria-label="Repostar"><Icon name="rota" /><span>{numRS(repostagens + (rep ? 1 : 0))}</span></button>
          <button type="button" className={liked ? "is-on is-rosa" : ""} onClick={stop(() => { setLikes((n) => n + (liked ? -1 : 1)); setLiked((v) => !v); })} aria-label="Curtir" aria-pressed={liked}>
            <svg viewBox="0 0 24 24" fill={liked ? "currentColor" : "none"} stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.3C1.2 8.6 3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 19 5 20.8 8.6 19.5 11.7 17.5 16.4 12 21 12 21z" /></svg>
            <span>{numRS(likes)}</span>
          </button>
          <button type="button" onClick={stop()} aria-label="Compartilhar"><Icon name="link" /></button>
        </footer>
      </div>
    </article>
  );
}

function ComporRS({ autor, onPublicar }) {
  const [texto, setTexto] = React.useState("");
  const resto = 280 - texto.length;
  const enviar = (e) => { e.preventDefault(); if (!texto.trim() || resto < 0) return; onPublicar(texto.trim()); setTexto(""); };
  return (
    <form className="hg-compor" onSubmit={enviar}>
      <FotoAvatar nome={autor} />
      <div className="hg-compor-corpo">
        <textarea value={texto} onChange={(e) => setTexto(e.target.value)} placeholder="O que está acontecendo no Reino?" rows={texto ? 3 : 2} aria-label="Nova publicação" />
        <div className="hg-compor-rodape">
          <div className="hg-compor-extras">
            <button type="button" aria-label="Imagem"><Icon name="vitrine" /></button>
            <button type="button" aria-label="Localização"><Icon name="pin" /></button>
            <button type="button" aria-label="Empresa"><Icon name="camadas" /></button>
          </div>
          <div className="hg-compor-envio">
            {texto ? <span className={"hg-compor-conta" + (resto < 20 ? " is-alerta" : "")}>{resto}</span> : null}
            <Button variant="cyan" type="submit" disabled={!texto.trim() || resto < 0}>Publicar</Button>
          </div>
        </div>
      </div>
    </form>
  );
}

const TITULO_POR_AUTOR = { "Ana Ribeiro": "Rei", "Camila Duarte": "Duque", "Eduarda Lopes": "Conde", "Henrique Alves": "Príncipe", "Gabriela Rocha": "Duque", "Felipe Nunes": "Duque" };
const NAV_RS = [["inicio", "visao", "Início"], ["explorar", "busca", "Explorar"], ["notificacoes", "sino", "Notificações"], ["mensagens", "msg", "Mensagens"], ["guildas", "guilda", "Guildas"], ["perfil", "tecnicos", "Perfil"]];

function RedeSocialScreen({ ir }) {
  const d = window.BABEL_DEMO;
  const st = useStories(d.perfil.nome);
  const empresasMarcaveis = React.useMemo(() => [...new Set([...d.feed.map((p) => p.empresa), ...d.match.map((m) => m.nome), ...d.guildas.map((g) => g.nome)].filter(Boolean))], []);
  const [aba, setAba] = React.useState("para-voce");
  const [nav, setNav] = React.useState("inicio");
  const [feed, setFeed] = React.useState(() => d.feed.map((p, i) => ({ ...p, titulo: TITULO_POR_AUTOR[p.autor], repostagens: [3, 5, 11, 1, 7, 2][i % 6] })));
  const publicar = (texto) => setFeed((f) => [{ autor: d.perfil.nome, empresa: "Você", titulo: d.perfil.titulo, quando: "agora", texto, curtidas: 0, comentarios: 0, repostagens: 0 }, ...f]);
  const lista = aba === "seguindo" ? feed.filter((p) => ["Ana Ribeiro", "Felipe Nunes", d.perfil.nome].includes(p.autor)) : aba === "grupo" ? feed.filter((p) => p.titulo === d.perfil.titulo) : feed;
  const tendencias = [["Marketing · em alta", "#diagnosticogratis", "1.204 publicações"], ["Curitiba", "#parceriacontabil", "863 publicações"], ["Reino", "#guildaplanalto", "412 publicações"], ["Saúde", "#novaunidade", "377 publicações"]];
  return (
    <div className="hg-social">
      <nav className="hg-social-nav" aria-label="Rede social">
        {NAV_RS.map(([id, icone, rotulo]) => (
          <button key={id} type="button" aria-pressed={nav === id} onClick={() => { setNav(id); if (id === "guildas") ir("guildas.html"); if (id === "mensagens") ir("chat.html"); }}>
            <Icon name={icone} /><span>{rotulo}</span>
          </button>
        ))}
        <Button variant="primary" onClick={() => document.querySelector(".hg-compor textarea")?.focus()}><Icon name="mais" /><span>Publicar</span></Button>
      </nav>

      <section className="hg-social-feed" aria-label="Linha do tempo">
        <div className="hg-social-topo">
          <h1>Rede social</h1>
          <div className="hg-social-abas" role="tablist">
            <button role="tab" aria-selected={aba === "para-voce"} onClick={() => setAba("para-voce")}>Para você</button>
            <button role="tab" aria-selected={aba === "seguindo"} onClick={() => setAba("seguindo")}>Seguindo</button>
            <button role="tab" aria-selected={aba === "grupo"} onClick={() => setAba("grupo")}>Grupo de {d.perfil.titulo}</button>
          </div>
        </div>
        <StoriesBar stories={st.stories} eu={d.perfil.nome} onAbrir={st.abrir} onCriar={st.criar} />
        <ComporRS autor={d.perfil.nome} onPublicar={publicar} />
        <div className="hg-timeline">
          {lista.map((p, i) => <PostRS key={p.autor + i} {...p} />)}
          {lista.length === 0 ? <p className="hg-sub" style={{ padding: "2rem 1rem", textAlign: "center" }}>Ninguém do seu grupo publicou ainda. Seja o primeiro.</p> : null}
        </div>
      </section>

      <aside className="hg-social-lado">
        <label className="hg-social-busca"><Icon name="busca" /><input type="search" placeholder="Buscar no Reino" /></label>
        <div className="hg-social-bloco">
          <h3>Quem combina com você</h3>
          {d.match.slice(0, 3).map((m) => (
            <ListRow key={m.nome} title={m.nome} subtitle={m.nicho + " · " + m.cidade} avatarGradient="match" right={<Button variant="ghost">Seguir</Button>} />
          ))}
          <a href="#" onClick={(e) => { e.preventDefault(); ir("match.html"); }}>Ver todos os matches</a>
        </div>
        <div className="hg-social-bloco">
          <h3>Em alta no Reino</h3>
          {tendencias.map(([cat, tag, qtd]) => (<a key={tag} className="hg-social-tend" href="#" onClick={(e) => e.preventDefault()}><small>{cat}</small><b>{tag}</b><span>{qtd}</span></a>))}
          <a href="#" onClick={(e) => { e.preventDefault(); ir("pesquisa.html"); }}>Mostrar mais</a>
        </div>
      </aside>
      {st.aberto ? ReactDOM.createPortal(<StoryViewer stories={st.stories} autor={st.aberto} eu={d.perfil.nome} onFechar={st.fechar} onTrocarAutor={st.abrir} onVisto={st.visto} onCurtir={st.curtir} onResponder={st.responder} onRepostar={st.repostar} onApagar={st.apagar} />, document.body) : null}
      {st.criando ? ReactDOM.createPortal(<StoryComposer eu={d.perfil.nome} empresas={empresasMarcaveis} inicial={st.criando.inicial} onPublicar={st.publicar} onFechar={st.cancelar} />, document.body) : null}
    </div>
  );
}

Object.assign(window, { RedeSocialScreen, PostRS });

})();
</script>
<script type="text/babel" data-presets="react">
/* DashboardScreen.jsx */
(() => {
const { PageHead, Panel, Button, KpiCard, ProgressRing, MetricRow, ListRow, Pill, Icon,
  FeedPost, AffiliateLink, AffiliateLevel, DonutChart, LineChart, BarMetric, Stars, Tabs } = window.BabelOSDesignSystem_5ad360;

/* Widgets do Dashboard. Cada um pode ser ocultado no ✕ e volta pelo botão
   Personalizar; a escolha fica salva neste navegador. A grade recalcula as
   colunas conforme o que sobrou, então nada fica em cima de nada nem deixa buraco. */
const WIDGETS = {
  "kpi-afiliados": "Afiliados ativos", "kpi-bonus": "Bônus acumulado", "kpi-negocios": "Negócios fechados", "kpi-cidades": "Cidades ativas",
  social: "Rede social", mapa: "Mapa Reino", noticias: "Notícias", chat: "Bate Papo",
  conquistas: "Conquistas", match: "Match e alertas",
  reputacao: "Score de reputação", bolsa: "Bolsa de Valores", vendas: "Vendas", afiliado: "Link de afiliado",
};
const CHAVE = "reino.widgets.ocultos";

function useWidgets() {
  const [ocultos, setOcultos] = React.useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem(CHAVE) || "[]")); } catch (e) { return new Set(); }
  });
  React.useEffect(() => { try { localStorage.setItem(CHAVE, JSON.stringify([...ocultos])); } catch (e) {} }, [ocultos]);
  const ve = (id) => !ocultos.has(id);
  const esconder = (id) => setOcultos((s) => new Set([...s, id]));
  const mostrar = (id) => setOcultos((s) => { const n = new Set(s); n.delete(id); return n; });
  const restaurar = () => setOcultos(new Set());
  return { ocultos, ve, esconder, mostrar, restaurar };
}

function DashboardScreen({ ir, usuario }) {
  const d = window.BABEL_DEMO;
  const a = d.afiliado;
  const w = useWidgets();
  const [grupo, setGrupo] = React.useState(d.gruposFeed[0]);
  // seletor ‹ › entre os grupos de título; o feed mostra só autores daquele título
  const TITULO_AUTOR = { "Ana Ribeiro": "Rei", "Camila Duarte": "Duque", "Eduarda Lopes": "Conde", "Henrique Alves": "Príncipe", "Gabriela Rocha": "Duque", "Felipe Nunes": "Duque", "Marcelo": "Imperador" };
  // Pré-cadastro: enquanto o ingresso não é confirmado, os módulos sociais ficam
  // fechados e o painel explica o que falta. A situação vem do perfil.
  // quem entra por "Criar conta" fica em pré-cadastro até o ingresso ser confirmado
  const preCadastro = ((typeof localStorage !== "undefined" && localStorage.getItem("reino.situacao")) || d.perfil.situacao || "") === "pre-cadastro";
  const escolhido = (typeof localStorage !== "undefined" && localStorage.getItem("reino.tituloEscolhido")) || d.perfil.titulo;
  const [travaAviso, setTravaAviso] = React.useState("");
  // no pré-cadastro os módulos pagos ficam trancados: o toque explica o que falta
  const travar = (nome) => (e) => { e.preventDefault(); setTravaAviso(nome); setTimeout(() => setTravaAviso(""), 3200); };
  const gi = d.gruposFeed.indexOf(grupo);
  const mudarGrupo = (dir) => setGrupo(d.gruposFeed[(gi + dir + d.gruposFeed.length) % d.gruposFeed.length]);
  const tituloGrupo = grupo.replace("Grupo de ", "");
  const feedGrupo = d.feed.filter((p) => TITULO_AUTOR[p.autor] === tituloGrupo);
  const SeletorGrupo = (
    <div className="hg-seletor" role="group" aria-label="Grupo de título">
      <button type="button" onClick={() => mudarGrupo(-1)} aria-label="Grupo anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg></button>
      <span key={grupo} className="hg-seletor-valor"><Icon name="coroa" size={13} />{tituloGrupo}<small>{gi + 1}/{d.gruposFeed.length}</small></span>
      <button type="button" onClick={() => mudarGrupo(1)} aria-label="Próximo grupo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg></button>
    </div>
  );
  const [personalizando, setPersonalizando] = React.useState(false);
  const alcance = d.regras.alcanceMapa[d.perfil.titulo] || d.regras.alcanceMapaPadrao;

  /* colunas de operação: só as que têm algum widget visível entram na grade */
  const colEsq = w.ve("social");
  const colCentro = w.ve("mapa") || w.ve("noticias") || w.ve("chat");
  const colDir = w.ve("conquistas") || w.ve("match");
  const colunas = [colEsq && "esquerda", colCentro && "centro", colDir && "direita"].filter(Boolean).join(" ");
  const kpis = ["kpi-afiliados", "kpi-bonus", "kpi-negocios", "kpi-cidades"].filter(w.ve);
  const analytics = ["reputacao", "bolsa", "vendas"].filter(w.ve);
  const escondidos = [...w.ocultos].filter((id) => WIDGETS[id]);

  return (
    <>
      <PageHead title={"Olá, " + d.perfil.nome.split(" ")[0]} subtitle="Veja o que está acontecendo no seu Reino hoje.">
        <div className="hg-head-acoes">
          <AffiliateLevel level={a.nivel} indicados={a.indicados} proximo={a.proximo} progress={a.progresso} compact />
          <Button variant={personalizando ? "cyan" : "ghost"} icon="visao" onClick={() => setPersonalizando((v) => !v)} aria-expanded={personalizando}>
            Personalizar{escondidos.length ? " (" + escondidos.length + ")" : ""}
          </Button>
        </div>
      </PageHead>

      {personalizando ? (
        <div className="hg-widgets-barra" role="region" aria-label="Widgets ocultos">
          {escondidos.length ? (
            <>
              <span className="hg-sub">Mostrar de novo:</span>
              {escondidos.map((id) => <button key={id} className="hg-widget-chip" onClick={() => w.mostrar(id)}><Icon name="mais" />{WIDGETS[id]}</button>)}
              <Button variant="ghost" onClick={w.restaurar}>Restaurar tudo</Button>
            </>
          ) : <span className="hg-sub">Todos os widgets estão visíveis. Use o ✕ de cada um para ocultar; a grade fecha o espaço sozinha.</span>}
        </div>
      ) : null}

      {kpis.length ? (
        <section className="hg-kpis" aria-label="Indicadores do Reino" data-itens={kpis.length}>
          {w.ve("kpi-afiliados") ? <KpiCard label="Afiliados ativos" value={String(a.indicados)} trend={12} foot="nesta semana" onClose={() => w.esconder("kpi-afiliados")} /> : null}
          {w.ve("kpi-bonus") ? <KpiCard label="Bônus acumulado" value={"R$ " + a.comissoesPendentes.toLocaleString("pt-BR", { minimumFractionDigits: 2 })} size="1.5rem" trend={8} foot="a receber" onClose={() => w.esconder("kpi-bonus")} /> : null}
          {w.ve("kpi-negocios") ? <KpiCard label="Negócios fechados" value="32" trend={6} foot="nesta semana" onClose={() => w.esconder("kpi-negocios")} /> : null}
          {w.ve("kpi-cidades") ? <KpiCard label="Cidades ativas" value="346" trend={4} foot="nesta semana" onClose={() => w.esconder("kpi-cidades")} /> : null}
        </section>
      ) : null}

      {colunas ? (
        <section className="hg-ops" data-colunas={colunas}>
          {colEsq ? (
            <div className="hg-col" data-zona="esquerda">
              <Panel tone="social" fill title="Rede social e feed de negócios" subtitle="Publicações do seu grupo de título" onClose={() => w.esconder("social")}
                actions={SeletorGrupo}>
                <div className={"hg-timeline hg-rolar" + (preCadastro ? " is-bloqueada" : "")} key={grupo} aria-hidden={preCadastro || undefined}>
                  {feedGrupo.length ? feedGrupo.slice(0, 4).map((p) => <PostRS key={p.autor} {...p} titulo={TITULO_AUTOR[p.autor]} />)
                    : <p className="hg-sub" style={{ padding: "1.2rem .6rem", textAlign: "center" }}>Ninguém do grupo de {tituloGrupo} publicou ainda. Seja o primeiro na rede social.</p>}
                </div>
                {preCadastro ? (
                  <div className="hg-pre-aviso" role="note">
                    <span className="hg-pre-aviso-ico"><Icon name="coroa" /></span>
                    <strong>Seu ingresso está em análise</strong>
                    <p>Você está no pré-cadastro: já reservou {escolhido ? <b>{escolhido}</b> : "seu título"} e o território. A rede social, as guildas e o Match abrem quando seu ingresso no Reino for confirmado.</p>
                    <Button variant="cyan" block icon="coroa" onClick={() => ir("pre-cadastro.html")}>Concluir meu ingresso</Button>
                    <span className="hg-sub">Enquanto isso, você pode explorar o mapa e acompanhar a bolsa.</span>
                  </div>
                ) : <Button block onClick={() => ir("rede-social.html")}>Abrir rede social</Button>}
              </Panel>
            </div>
          ) : null}

          {colCentro ? (
            <div className="hg-col" data-zona="centro">
              {w.ve("mapa") ? <MapaPanel usuario={usuario} subtitle={"Seu título mostra: " + alcance + ". Desça até o bairro para ver a rede de empresas."} onClose={() => w.esconder("mapa")} /> : null}
              {w.ve("noticias") ? (
                <Panel title="Notícias de afiliados e finanças" subtitle="Atualizado agora" headingLevel={3} onClose={() => w.esconder("noticias")}>
                  <ul className="hg-noticias">
                    {d.noticias.slice(0, 3).map((n) => (
                      <li key={n.titulo}><strong>{n.titulo}</strong><span><em>{n.tag}</em>{n.fonte} · {n.quando}</span></li>
                    ))}
                  </ul>
                </Panel>
              ) : null}
              {w.ve("chat") ? (
                <Panel title="Bate Papo do Reino" subtitle="Só Marquês para cima envia mensagem" headingLevel={3} onClose={() => w.esconder("chat")}>
                  <ul className="hg-list">
                    {d.conversas.slice(0, 2).map((c) => (
                      <ListRow key={c.nome} title={c.nome} subtitle={c.ultima} avatar={c.nome}
                        right={c.naoLidas ? <Pill>{c.naoLidas}</Pill> : <time>{c.quando}</time>} />
                    ))}
                  </ul>
                  <Button variant="ghost" block onClick={() => ir("chat.html")}>Abrir o Bate Papo</Button>
                </Panel>
              ) : null}
            </div>
          ) : null}

          {colDir ? (
            <div className="hg-col" data-zona="direita">
              {w.ve("conquistas") ? (
                <Panel tone="conquistas" title="Conquistas" subtitle="Sua evolução no Reino" onClose={() => w.esconder("conquistas")}>
                  <ProgressRing value={64} label="até Príncipe" />
                  {d.metricas.map((m) => <MetricRow key={m.nome} name={m.nome} label={m.rotulo} value={m.percentual} />)}
                  <Button variant="ghost" block onClick={() => ir("conquistas.html")}>Ver conquistas</Button>
                </Panel>
              ) : null}
              {w.ve("match") ? (
                <Panel tone="match" fill title="Match e alertas" subtitle="Empresas complementares e o que pede atenção" onClose={() => w.esconder("match")}>
                  <div className="hg-rolar">
                    <ul className="hg-list">
                      {d.match.slice(0, 2).map((m) => (
                        <ListRow key={m.nome} title={m.nome} subtitle={m.nicho + " · " + m.cidade} avatarGradient="match" right={<Pill>{m.compatibilidade}%</Pill>} />
                      ))}
                      {d.alertas.map((al) => (
                        <li className="hg-row" key={al.titulo}>
                          <span className="hg-avatar" style={{ background: al.tipo === "alta" ? "linear-gradient(135deg,#ff4d7a,#e04bff)" : "linear-gradient(135deg,#3b82ff,#8b5cff)" }}>
                            <Icon name={al.tipo === "alta" ? "alerta" : "agenda"} />
                          </span>
                          <div><strong>{al.titulo}</strong><span>{al.texto}</span></div>
                          <time>{al.quando}</time>
                        </li>
                      ))}
                    </ul>
                  </div>
                  <Button block onClick={() => ir("match.html")}>Ver todos os matches</Button>
                </Panel>
              ) : null}
            </div>
          ) : null}
        </section>
      ) : null}

      {analytics.length ? (
        <section className="hg-analytics" aria-label="Analytics do Reino" data-itens={analytics.length}>
          {w.ve("reputacao") ? (
            <Panel tone="reputacao" title="Score de reputação" subtitle="Comentários e classificação recebidos" headingLevel={3} onClose={() => w.esconder("reputacao")}>
              <DonutChart segments={d.statusNegocios} total="100" label="negócios" />
              <div className="hg-rep-resumo">
                <div><span className="hg-sub">Classificação</span><Stars value={4.6} showValue /></div>
                <div><span className="hg-sub">Comentários</span><b>184</b></div>
              </div>
            </Panel>
          ) : null}
          {w.ve("bolsa") ? (
            <Panel title="Bolsa de Valores" subtitle="Negócios fechados por dia" headingLevel={3} onClose={() => w.esconder("bolsa")}>
              <div className={preCadastro ? "hg-trava-conteudo" : undefined}><LineChart points={d.negociosSemana.pontos} labels={d.negociosSemana.rotulos} highlight="342" /></div>
              {preCadastro
                ? <Button variant="ghost" block className="is-travado" icon="coroa" onClick={travar("A Bolsa de Valores")}>Desbloqueado ao ingressar no Reino</Button>
                : <Button variant="ghost" block onClick={() => ir("bolsa.html")}>Abrir a Bolsa</Button>}
            </Panel>
          ) : null}
          {w.ve("vendas") ? (
            <Panel tone="afiliado" title="Vendas" subtitle="Faturamento e eficiência de aquisição" headingLevel={3} onClose={() => w.esconder("vendas")}>
