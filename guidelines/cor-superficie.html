<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:flex;align-items:center}body::after{display:none}.sw{display:grid;gap:.3rem;min-width:0}.sw span{display:block;height:46px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.sw b{color:#fff;font:600 .78rem var(--font-d)}.sw small{color:var(--text-2);font-size:.66rem;font-variant-numeric:tabular-nums}.fila{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:.7rem;width:100%}</style></head><body><div class="fila" style="--n:5"><div class="sw"><span style="background:var(--bg)"></span><b>--bg</b><small>#030817</small></div><div class="sw"><span style="background:var(--panel-a)"></span><b>--panel-a</b><small>rgba(14,30,64,.8)</small></div><div class="sw"><span style="background:var(--panel-b)"></span><b>--panel-b</b><small>rgba(8,15,40,.72)</small></div><div class="sw"><span style="background:var(--surface-sunken)"></span><b>--surface-sunken</b><small>rgba(8,18,45,.5)</small></div><div class="sw"><span style="background:var(--surface-field)"></span><b>--surface-field</b><small>rgba(8,18,45,.75)</small></div></div></body></html>
