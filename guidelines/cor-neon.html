<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:flex;align-items:center}body::after{display:none}.sw{display:grid;gap:.3rem;min-width:0}.sw span{display:block;height:46px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.sw b{color:#fff;font:600 .78rem var(--font-d)}.sw small{color:var(--text-2);font-size:.66rem;font-variant-numeric:tabular-nums}.fila{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:.7rem;width:100%}</style></head><body><div class="fila" style="--n:4"><div class="sw"><span style="background:var(--cyan)"></span><b>--cyan</b><small>#3fe3ff</small></div><div class="sw"><span style="background:var(--blue)"></span><b>--blue</b><small>#3b82ff</small></div><div class="sw"><span style="background:var(--violet)"></span><b>--violet</b><small>#8b5cff</small></div><div class="sw"><span style="background:var(--magenta)"></span><b>--magenta</b><small>#e04bff</small></div></div></body></html>
