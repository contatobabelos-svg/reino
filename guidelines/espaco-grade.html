<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:flex;align-items:center}body::after{display:none}.g{display:grid;gap:.7rem;width:100%}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}.k i{height:44px;border-radius:var(--r);background:var(--surface-panel);box-shadow:inset 0 0 0 1px var(--line)}.o{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:1.1rem}.o i{height:60px;border-radius:var(--r);background:var(--surface-panel);box-shadow:inset 0 0 0 1px var(--line)}.g b{color:var(--text-2);font:400 .64rem var(--font)}</style></head><body><div class="g"><div class="k"><i></i><i></i><i></i><i></i></div><b>.hg-kpis · repeat(4,minmax(0,1fr)) · gap --gap-grade 1.1rem</b><div class="o"><i></i><i></i><i></i></div><b>.hg-ops · 280px / 1fr / 300px</b></div></body></html>
