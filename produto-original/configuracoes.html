<body data-page="configuracoes" class="">
<div class="hg-app">
<aside id="hg-side"></aside>
<div class="hg-main">
<header id="hg-top"></header>
<script src="js/shell.js"></script>
<main class="hg-content" id="conteudo">
<div class="hg-page-head"><div><h1>Configurações</h1><p>Fonte de dados e perfil.</p></div></div>
<div class="hg-duas hg-encher">
<section class="hg-panel hg-encher hg-rolar">
  <div class="hg-head"><div><h2 class="hg-title">Conexão com a API</h2><p class="hg-sub">Os painéis leem os endpoints descritos em <code>app/API.md</code>.</p></div></div>
  <form class="hg-form" id="form-config">
    <div class="hg-field"><label for="api">URL base da API</label><input class="hg-input" id="api" name="api" type="url" placeholder="https://api.suaempresa.com/v1"><small>Fica salva apenas neste navegador.</small></div>
    <div class="hg-field"><label for="token">Token de acesso (opcional)</label><input class="hg-input" id="token" name="token" type="password" autocomplete="off"><small>Enviado como <code>Authorization: Bearer</code>.</small></div>
    <div class="hg-field"><label for="usuario">Seu nome</label><input class="hg-input" id="usuario" name="usuario" type="text" autocomplete="name"></div>
    <div class="hg-field"><label for="bairro">Seu endereço no Reino</label><div style="display:grid;grid-template-columns:2fr 70px 2fr;gap:.5rem"><input class="hg-input" id="cidade" name="cidade" placeholder="Cidade" autocomplete="address-level2"><input class="hg-input" id="uf" name="uf" placeholder="UF" maxlength="2" autocomplete="address-level1"><input class="hg-input" id="bairro" name="bairro" placeholder="Bairro"></div><small>Ao logar, o globo voa até o seu bairro.</small></div>
    <div class="hg-toolbar"><button class="hg-btn is-cyan" type="submit">Salvar</button><button class="hg-btn is-ghost" type="button" id="testar">Testar conexão</button></div>
  </form>
</section>
<section class="hg-panel hg-encher hg-rolar">
  <div class="hg-head"><h2 class="hg-title">Notificações</h2></div>
  <label class="hg-switch"><span><b style="color:#fff">Dados de demonstração</b><br><small style="color:var(--text-2)">Usa 10 pessoas e 29 empresas fictícias quando não há API.</small></span> <input type="checkbox" name="demo" form="form-config"></label>
  <label class="hg-switch">Novos matches <input type="checkbox" checked></label>
  <label class="hg-switch">Conquistas desbloqueadas <input type="checkbox" checked></label>
  <label class="hg-switch">Novas edições da Revista <input type="checkbox"></label>
</section>
</div>
</main>
</div>
</div>
