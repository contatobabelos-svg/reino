<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { Sidebar, TopBar, TabBar, Tabs, MapDock, DemoBadge } = window.BabelOSDesignSystem_5ad360;
function Demo() {
  const [aba, setAba] = React.useState("mapa");
  const [faixa, setFaixa] = React.useState("Mês");
  return (
    <div style={{ display: "grid", gap: ".8rem" }}>
      <div className="shell">
        <Sidebar current="guildas.html" />
        <div style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
          <TopBar user="Bruno Carvalho" notifications actions={<DemoBadge inline>Dados fictícios</DemoBadge>} />
          <div style={{ padding: "1rem", display: "grid", gap: ".8rem", alignContent: "start" }}>
            <Tabs items={["Semana", "Mês", "Ano"]} value={faixa} onChange={setFaixa} />
            <MapDock value={aba} onChange={setAba} items={[
              { value: "mapa", icon: "mapa", label: "Mapa" },
              { value: "noticias", icon: "noticias", label: "Notícias" },
              { value: "busca", icon: "buscaIA", label: "Busca IA" },
            ]} />
          </div>
        </div>
      </div>
      <TabBar current="guildas.html" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
