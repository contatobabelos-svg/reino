<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:flex;align-items:center}body::after{display:none}.r{display:flex;gap:1rem;align-items:flex-end;width:100%}.r div{display:grid;gap:.35rem;justify-items:center;flex:1}.r i{display:block;width:100%;height:64px;background:var(--surface-panel);box-shadow:var(--glow),inset 0 0 0 1px var(--line)}.r small{color:var(--text-3);font-size:.62rem;text-align:center}</style></head><body><div class="r">
<div><i style="border-radius:var(--r)"></i><small>--r 20px<br>painel</small></div>
<div><i style="border-radius:var(--r-16)"></i><small>--r-16<br>lista, mapa</small></div>
<div><i style="border-radius:var(--r-14)"></i><small>--r-14<br>linha, gaveta</small></div>
<div><i style="border-radius:var(--r-sm)"></i><small>--r-sm 12px<br>botão</small></div>
<div><i style="border-radius:var(--r-10)"></i><small>--r-10<br>campo</small></div>
<div><i style="border-radius:var(--r-pill);box-shadow:var(--neon-cyan)"></i><small>--r-pill<br>+ --neon-cyan</small></div>
</div></body></html>
