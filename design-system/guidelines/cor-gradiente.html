<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:flex;align-items:center}body::after{display:none}.sw{display:grid;gap:.3rem;min-width:0}.sw span{display:block;height:46px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.sw b{color:#fff;font:600 .78rem var(--font-d)}.sw small{color:var(--text-2);font-size:.66rem;font-variant-numeric:tabular-nums}.fila{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:.7rem;width:100%}</style></head><body><div class="fila" style="--n:4"><div class="sw"><span style="background:var(--grad-brand)"></span><b>--grad-brand</b><small>ciano → violeta</small></div><div class="sw"><span style="background:var(--grad-btn)"></span><b>--grad-btn</b><small>azul → violeta</small></div><div class="sw"><span style="background:var(--grad-btn-cyan)"></span><b>--grad-btn-cyan</b><small>#1f9bff → #3fe3ff</small></div><div class="sw"><span style="background:var(--grad-gold)"></span><b>--grad-gold</b><small>#f5c76a → #e0a33c</small></div></div></body></html>
