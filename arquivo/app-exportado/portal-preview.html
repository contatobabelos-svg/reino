<body data-page="portal">
<!-- Pré-visualização do PortalLogin sem mexer no App.jsx. Pode ser apagado depois da troca. -->
<div id="root"></div>
<script type="text/babel" src="PortalLogin.jsx"></script>
<script type="text/babel" data-presets="react">
function PreviaPortal() {
  const q = new URLSearchParams(location.search);
  const [conta, setConta] = React.useState(null);
  if (conta) return <div style={{ padding: "2rem", color: "var(--text)", fontFamily: "var(--font)" }} role="status">Entrou: {conta.email || "sessão"} (onEntrar chamado)</div>;
  return <PortalLogin onEntrar={(c) => { window.__portalEntrou = c || true; setConta(c || {}); }} recuperacao={q.get("recuperacao") === "1"} avisoInicial={q.get("aviso") || ""} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<PreviaPortal />);
</script>
</body></html>
